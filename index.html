<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXICON — Latein-Vokabeltrainer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#e9e0c9;
  --bg-deep:#dcd0ae;
  --card:#f5efdf;
  --card-edge:#c9bb95;
  --ink:#2b2117;
  --ink-soft:#6b5c48;
  --ink-faint:#9c8c72;
  --accent:#8c2f28;
  --accent-dark:#6a221d;
  --accent-tint:#f0ded9;
  --gold:#a9823d;
  --success:#4f6b52;
  --success-tint:#dfe8de;
  --error:#a8451f;
  --error-tint:#f2ded2;
  --line: rgba(43,33,23,0.16);
  --shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 10px 24px -14px rgba(43,33,23,0.55);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at top left, rgba(255,255,255,0.25), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(0,0,0,0.06), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:'Source Serif 4', Georgia, serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

::selection{ background:var(--gold); color:var(--card); }
:focus-visible{ outline:2.5px solid var(--gold); outline-offset:2px; border-radius:3px; }
button{ font-family:inherit; cursor:pointer; }
input, select{ font-family:inherit; }

.wrap{ max-width:760px; margin:0 auto; padding:36px 20px 80px; }

header.top{ text-align:center; margin-bottom:28px; position:relative; }
.crest{ display:inline-flex; align-items:center; gap:10px; margin-bottom:6px; }
.crest svg{ width:30px; height:30px; }
h1.title{
  font-family:'Cinzel', serif; font-weight:700; font-size:clamp(28px, 6vw, 40px);
  letter-spacing:0.14em; margin:0; color:var(--accent-dark);
  text-shadow: 0 1px 0 rgba(255,255,255,0.5), 0 2px 3px rgba(43,33,23,0.15);
}
p.subtitle{ font-style:italic; color:var(--ink-soft); margin:6px 0 0; font-size:15px; letter-spacing:0.02em; }
.pool-stat{ margin-top:10px; font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.05em; color:var(--ink-faint); text-transform:uppercase; }
.version-tag{ margin-top:4px; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-faint); opacity:0.7; }
.pool-stat b{ color:var(--accent); font-weight:600; }
.header-actions{ position:absolute; top:0; right:0; display:flex; align-items:flex-start; gap:8px; }
.account-bar{ position:relative; }
.settings-bar{ position:relative; }
.profile-menu{ position:relative; }
.profile-avatar{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--accent);
  background:var(--accent); color:#fdf6ea; font-family:'Cinzel', serif; font-weight:700; font-size:14px;
  display:flex; align-items:center; justify-content:center;
}
.profile-avatar:hover{ background:var(--accent-dark); }
.settings-gear-btn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--card-edge);
  background:#fffdf7; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
}
.settings-gear-btn svg{ width:18px; height:18px; }
.settings-gear-btn:hover{ background:var(--accent-tint); color:var(--accent-dark); border-color:var(--accent); }
.settings-dropdown{
  position:absolute; top:42px; right:0; z-index:20;
  background:var(--card); border:1px solid var(--card-edge); border-radius:8px; box-shadow:var(--shadow);
  padding:16px; min-width:230px; text-align:left;
}
.settings-dropdown h3{ margin:0 0 12px; font-family:'Cinzel', serif; font-size:13px; letter-spacing:0.06em; color:var(--accent-dark); text-transform:uppercase; }
.settings-row{ margin-bottom:14px; }
.settings-row:last-child{ margin-bottom:0; }
.settings-row-label{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--ink); margin-bottom:5px; }
.settings-row-label .settings-pct{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-faint); }
.settings-row input[type="range"]{ width:100%; accent-color:var(--accent); }
.settings-row input[type="checkbox"]{ margin-right:6px; }
.settings-row-toggle{ display:flex; align-items:center; font-size:12.5px; color:var(--ink-soft); }
.profile-dropdown{
  position:absolute; top:42px; right:0; z-index:20;
  background:var(--card); border:1px solid var(--card-edge); border-radius:8px; box-shadow:var(--shadow);
  padding:14px; min-width:220px; text-align:left;
}
.pd-email{ font-size:12.5px; color:var(--ink-soft); word-break:break-all; }
.pd-divider{ border:none; border-top:1px solid var(--line); margin:10px 0; }
.pd-item{
  display:block; width:100%; text-align:left; background:none; border:none; padding:8px 4px;
  font-size:13.5px; color:var(--ink); border-radius:5px;
}
.pd-item:hover{ background:var(--accent-tint); color:var(--accent-dark); }
.pd-form .field{ margin-bottom:10px; }

nav.tabs{ display:flex; gap:8px; border-bottom:2px solid var(--line); margin-bottom:26px; flex-wrap:wrap; }
nav.tabs button{
  flex:1 1 auto; min-width:120px; background:transparent; border:none; padding:12px 10px 14px;
  font-family:'Cinzel', serif; font-size:13px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--ink-faint); border-bottom:3px solid transparent; transition:color .2s, border-color .2s;
}
nav.tabs button:hover{ color:var(--accent-dark); }
nav.tabs button.active{ color:var(--accent); border-bottom-color:var(--accent); }
nav.tabs button:disabled{ opacity:0.35; cursor:not-allowed; }

.panel{ background:var(--card); border:1px solid var(--card-edge); border-radius:10px; box-shadow:var(--shadow); padding:26px; position:relative; }
.panel + .panel{ margin-top:20px; }
.panel::before{
  content:""; position:absolute; left:20px; right:20px; top:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent); opacity:0.5;
}
h2.section-title{
  font-family:'Cinzel', serif; font-size:15px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--accent-dark); margin:0 0 18px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
label.field-label{ display:block; font-size:12.5px; letter-spacing:0.04em; color:var(--ink-soft); margin-bottom:5px; font-family:'IBM Plex Mono', monospace; }
label.field-label .req{ color:var(--accent); }
input[type=text], input[type=email], input[type=password], input[type=number], select.select-field, textarea{
  width:100%; padding:9px 11px; border:1px solid var(--card-edge); background:#fffdf7; border-radius:6px;
  color:var(--ink); font-size:15px; transition:border-color .15s, box-shadow .15s;
}
input:focus, select.select-field:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(169,130,61,0.18); }
input.field-error{ border-color:var(--error); background:var(--error-tint); }
.field-error-msg{ font-size:12px; color:var(--error); margin-top:4px; }
.field-notice-msg{ font-size:12.5px; color:var(--success); margin-top:8px; }
.field{ margin-bottom:16px; }
.field-hint{ font-size:12px; color:var(--ink-faint); margin-top:4px; }
textarea{ resize:vertical; font-family:inherit; }

.segmented{ display:flex; border:1px solid var(--card-edge); border-radius:7px; overflow:hidden; }
.segmented button{ flex:1; background:#fffdf7; border:none; padding:9px 6px; font-size:13px; color:var(--ink-soft); border-right:1px solid var(--card-edge); }
.segmented button:last-child{ border-right:none; }
.segmented button.active{ background:var(--accent); color:#fff9ef; }

.meaning-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.meaning-row input{ flex:1; }
.icon-btn{
  border:1px solid var(--card-edge); background:#fffdf7; width:34px; height:34px; border-radius:6px;
  color:var(--accent); font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.icon-btn:hover{ background:var(--accent-tint); }
.link-add{ background:none; border:none; color:var(--accent-dark); font-size:13px; text-decoration:underline; text-underline-offset:3px; padding:2px 0; margin-top:2px; }

.btn-row{ display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; align-items:center;}
.btn{
  font-family:'Cinzel', serif; letter-spacing:0.06em; font-size:13px; text-transform:uppercase;
  padding:12px 22px; border-radius:7px; border:1px solid var(--accent); background:var(--accent); color:#fdf6ea;
  transition:background .15s, transform .1s;
}
.btn:hover{ background:var(--accent-dark); }
.btn:active{ transform:translateY(1px); }
.btn.secondary{ background:transparent; color:var(--accent-dark); }
.btn.secondary:hover{ background:var(--accent-tint); }
.btn:disabled{ opacity:0.4; cursor:not-allowed; }
.btn.small{ padding:9px 16px; font-size:12px; }
.btn.full{ width:100%; }

.field-label-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px; }
.field-label-row .field-label{ margin-bottom:0; }
.lookup-btn{
  display:inline-flex; align-items:center; gap:5px; flex-shrink:0;
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.03em; text-transform:uppercase;
  color:var(--gold); text-decoration:none; border:1px solid var(--gold); border-radius:20px;
  padding:3px 10px 3px 8px; background:transparent; transition:background .15s, color .15s;
}
.lookup-btn:hover{ background:var(--gold); color:#fff9ef; }
.lookup-btn svg{ width:11px; height:11px; flex-shrink:0; }
.lookup-btn svg circle, .lookup-btn svg line{ stroke:currentColor; }
.latin-input-wrap{ position:relative; }

.pool-list{ display:flex; flex-direction:column; gap:6px; margin-top:6px; }
.pool-item{ display:flex; align-items:center; gap:10px; padding:9px 12px; background:#fffdf7; border:1px solid var(--line); border-radius:6px; font-size:14px; flex-wrap:wrap; }
.pool-item .lw{ font-weight:600; color:var(--accent-dark); min-width:100px; }
.pool-item .meta{ color:var(--ink-faint); font-size:12px; font-family:'IBM Plex Mono', monospace; flex:1; min-width:140px; }
.pool-item .folder-chip{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--gold); border:1px solid var(--gold); border-radius:20px; padding:2px 8px; }
.pool-item .actions{ display:flex; gap:6px; margin-left:auto; }
.pool-item .actions button{ border:none; background:none; font-size:13px; color:var(--ink-faint); padding:2px 6px; }
.pool-item .actions button:hover{ color:var(--accent); }
.empty-note{ color:var(--ink-faint); font-style:italic; font-size:14px; padding:10px 2px; }

.filter-row{ display:flex; gap:10px; margin:14px 0 10px; flex-wrap:wrap; }
.filter-row input{ flex:2; min-width:160px; }
.filter-row select{ flex:1; min-width:140px; }

.context-bar{ margin-bottom:20px; }
.context-label{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px; }
.context-chips{ display:flex; flex-wrap:wrap; gap:8px; }
.folder-chip-btn{
  border:1px solid var(--card-edge); background:#fffdf7; border-radius:20px; padding:6px 14px;
  font-size:13px; color:var(--ink-soft);
}
.folder-chip-btn:hover{ background:var(--accent-tint); }
.folder-chip-btn.active{ background:var(--accent); color:#fff9ef; border-color:var(--accent); }
.folder-chip-btn.add{ border-style:dashed; color:var(--gold); border-color:var(--gold); }
.quick-add-row{ display:flex; gap:8px; margin-top:10px; }
.quick-add-row input{ flex:1; }

.pool-item.compact{ padding:6px 10px; font-size:13px; }
.pool-checkbox{ flex-shrink:0; width:16px; height:16px; accent-color:var(--accent); }
.pool-checkbox{ pointer-events:none; }
.pool-item.selectable{ cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
.pool-item.selectable:hover{ border-color:var(--accent); }
.pool-item.selected{ background:var(--accent-tint); border-color:var(--accent); }
.btn.danger{ background:#8f2f2f; border-color:#8f2f2f; color:#fdf6ea; }
.btn.danger:hover{ background:#6e2020; }
.dict-suggestions{
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:30;
  display:flex; flex-direction:column; gap:2px;
  background:var(--card); border:1px solid var(--card-edge); border-radius:8px;
  box-shadow:var(--shadow); padding:6px; max-height:280px; overflow-y:auto;
}
.dict-suggestions:empty{ display:none; border:none; box-shadow:none; padding:0; }
.dict-suggestion-item{
  display:flex; align-items:center; gap:10px; text-align:left; width:100%;
  padding:8px 10px; border:1px solid transparent; background:transparent; border-radius:6px; font-size:13px; color:var(--ink);
}
.dict-suggestion-item:hover, .dict-suggestion-item.active{ background:var(--accent-tint); border-color:var(--accent); }
.dict-suggestion-item .dsi-word{ font-weight:600; color:var(--accent-dark); min-width:90px; }
.dict-suggestion-item .dsi-type{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; color:var(--gold); flex-shrink:0; }
.dict-suggestion-item .dsi-meaning{ color:var(--ink-faint); flex:1; text-align:left; }
.select-all-row{ font-size:12.5px; color:var(--ink-soft); margin:2px 0 10px; }
.select-all-row label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
.bulk-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--accent-tint); border:1px solid var(--accent); border-radius:8px;
  padding:10px 14px; margin-bottom:12px; font-size:13px; color:var(--accent-dark);
}
.bulk-bar select{ padding:6px 8px; border-radius:6px; border:1px solid var(--card-edge); background:#fffdf7; font-size:13px; }

.pagination-row{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:12px; font-size:13px; color:var(--ink-soft); }
.pagination-row button:disabled{ opacity:0.4; cursor:default; }

.folder-manage-row{ display:flex; gap:8px; margin-bottom:12px; }
.folder-manage-row input{ flex:1; }
.folder-tag-list{ display:flex; flex-wrap:wrap; gap:8px; }
.folder-tag{ display:flex; align-items:center; gap:6px; background:#fffdf7; border:1px solid var(--card-edge); border-radius:20px; padding:5px 6px 5px 12px; font-size:13px; }
.folder-tag button{ border:none; background:none; color:var(--ink-faint); font-size:12px; width:22px; height:22px; border-radius:50%; }
.folder-tag button:hover{ color:var(--accent); background:var(--accent-tint); }

.practice-wrap{ display:flex; flex-direction:column; align-items:center; }
.practice-top-row{ width:100%; max-width:420px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px; flex-wrap:wrap; }
.practice-progress{ font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.06em; color:var(--ink-faint); }
.folder-select{ font-size:12.5px; padding:6px 8px; border:1px solid var(--card-edge); border-radius:6px; background:#fffdf7; color:var(--ink-soft); }
.flashcard{ width:100%; max-width:420px; height:270px; perspective:1600px; margin-top:8px; }
.flashcard-inner{ position:relative; width:100%; height:100%; transition:transform .55s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d; cursor:pointer; }
.flashcard.flipped .flashcard-inner{ transform:rotateY(180deg); }
.face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:10px; border:1px solid var(--card-edge);
  background: linear-gradient(155deg, rgba(255,255,255,0.5), transparent 40%), var(--card);
  box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px; text-align:center;
}
.face.front .word{ font-family:'Cinzel', serif; font-size:clamp(26px,6vw,36px); color:var(--accent-dark); letter-spacing:0.03em; text-shadow:0 1px 0 rgba(255,255,255,0.6); }
.face.front .type-tag{ margin-top:12px; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); }
.face.front .flip-hint{ position:absolute; bottom:16px; font-size:11px; color:var(--ink-faint); font-style:italic; }
.face.back{ transform:rotateY(180deg); }
.face.back .word{ font-family:'Cinzel', serif; font-size:20px; color:var(--accent-dark); margin-bottom:10px; }
.face.back .forms{ font-family:'IBM Plex Mono', monospace; font-size:13.5px; color:var(--ink-soft); margin-bottom:12px; line-height:1.7; }
.face.back hr{ width:60px; border:none; border-top:1px solid var(--gold); opacity:0.5; margin:0 0 10px; }
.face.back .meanings{ font-size:16px; color:var(--ink); line-height:1.5; }
.face.back .card-notes{ font-size:12.5px; color:var(--ink-faint); font-style:italic; margin-top:8px; line-height:1.4; }
.practice-controls{ display:flex; gap:12px; margin-top:22px; align-items:center; flex-wrap:wrap; justify-content:center; }

.settings-row{ display:flex; flex-direction:column; gap:18px; }
.slider-row{ display:flex; align-items:center; gap:14px; }
input[type=range]{ flex:1; accent-color:var(--accent); }
.slider-val{ font-family:'IBM Plex Mono', monospace; min-width:34px; text-align:center; color:var(--accent-dark); font-weight:600; }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; background:#fffdf7; border:1px solid var(--line); padding:12px 14px; border-radius:7px; }
.settings-group{ border:1px solid var(--line); border-radius:7px; overflow:hidden; background:#fffdf7; }
.settings-group .toggle-row{ border:none; border-radius:0; border-bottom:1px solid var(--line); }
.settings-group .meanings-row{ padding:12px 14px; }
.settings-group .meanings-row .label{ font-size:14px; margin-bottom:9px; }
.toggle-row .label{ font-size:14px; }
.toggle-row .desc{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
.switch{ position:relative; width:44px; height:24px; flex-shrink:0; }
.switch input{ opacity:0; width:0; height:0; }
.switch .track{ position:absolute; inset:0; background:var(--card-edge); border-radius:20px; transition:background .2s; }
.switch .knob{ position:absolute; top:3px; left:3px; width:18px; height:18px; background:#fff9ef; border-radius:50%; transition:transform .2s; box-shadow:0 1px 2px rgba(0,0,0,0.3); }
.switch input:checked + .track{ background:var(--accent); }
.switch input:checked + .track .knob{ transform:translateX(20px); }

.test-progress{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-faint); letter-spacing:0.06em; margin-bottom:14px; }
.test-word{ font-family:'Cinzel', serif; font-size:clamp(24px,5vw,32px); color:var(--accent-dark); text-align:center; margin-bottom:6px; }
.test-type{ text-align:center; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:22px; }
.answer-block{ margin-bottom:22px; }
.answer-block .block-title{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); margin-bottom:10px; }
.answer-input-row{ margin-bottom:10px; position:relative; }
.answer-input-row input{ width:100%; }
.answer-display{
  width:100%; box-sizing:border-box; padding:9px 11px; border-radius:6px; font-size:15px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; border:1px solid var(--card-edge); min-height:37px;
}
.answer-display.correct{ border-color:var(--success); background:var(--success-tint); color:var(--success); }
.answer-display.incorrect{ border-color:var(--error); background:var(--error-tint); color:var(--error); }
.answer-display .check-icon{ font-weight:700; margin-left:auto; }
.wrong-strike{ text-decoration:line-through; opacity:0.7; }
.correct-fill{ font-weight:600; }

.summary-score{ text-align:center; padding:10px 0 20px; }
.summary-score .big{ font-family:'Cinzel', serif; font-size:44px; color:var(--accent-dark); }
.summary-score .lbl{ font-size:13px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; text-transform:uppercase; letter-spacing:0.06em; margin-top:4px; }
.summary-list{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
.summary-item{ border:1px solid var(--line); border-radius:6px; padding:10px 12px; background:#fffdf7; font-size:13.5px; }
.summary-item .sw{ font-weight:600; color:var(--accent-dark); }
.summary-item .detail{ color:var(--ink-soft); margin-top:3px; font-size:12.5px; }

.empty-state{ text-align:center; padding:50px 20px; color:var(--ink-faint); }
.empty-state .big-word{ font-family:'Cinzel', serif; font-size:20px; color:var(--accent-dark); margin-bottom:8px; }

.auth-tabs{ display:flex; gap:8px; margin-bottom:20px; }
.auth-tabs button{ flex:1; padding:10px; border:1px solid var(--card-edge); background:#fffdf7; border-radius:7px; font-size:13px; color:var(--ink-soft); }
.auth-tabs button.active{ background:var(--accent); color:#fff9ef; border-color:var(--accent); }

.setup-notice{ font-size:14px; line-height:1.7; }

/* ===================== DATA LAYER (Supabase) ===================== */
async function loadPool(){
  const { data: vocabRows, error: vErr } = await sbClient.from('vocab').select('*').order('latin');
  const { data: linkRows, error: lErr } = await sbClient.from('vocab_folders').select('*');
  if(lErr) console.error(lErr);
  const foldersByVocab = {};
  (linkRows||[]).forEach(l=>{
    if(!foldersByVocab[l.vocab_id]) foldersByVocab[l.vocab_id] = [];
    foldersByVocab[l.vocab_id].push(l.folder_id);
  });
  if(vErr){ console.error(vErr); state.pool = []; }
  else {
    state.pool = vocabRows.map(r => ({
      id: r.id, type: r.type, latin: r.latin,
      forms: r.forms || {}, meanings: r.meanings || [], notes: r.notes || '',
      folderIds: foldersByVocab[r.id] || [], createdAt: r.created_at
    }));
  }
  const { data: folderRows, error: fErr } = await sbClient.from('folders').select('*').order('name');
  if(fErr){ console.error(fErr); state.folders = []; }
  else {
    state.folders = folderRows.map(f => ({ id: f.id, name: f.name }));
  }
}

async function setVocabFolders(vocabId, folderIds){
  const { error: delErr } = await sbClient.from('vocab_folders').delete().eq('vocab_id', vocabId);
  if(delErr) throw delErr;
  const ids = (folderIds||[]).filter(Boolean);
  if(ids.length){
    const { error: insErr } = await sbClient.from('vocab_folders').insert(ids.map(fid=>({ vocab_id: vocabId, folder_id: fid })));
    if(insErr) throw insErr;
  }
}
async function insertVocab(entry){
  const { data, error } = await sbClient.from('vocab').insert({
    type: entry.type, latin: entry.latin, forms: entry.forms,
    meanings: entry.meanings, notes: entry.notes || ''
  }).select().single();
  if(error) throw error;
  await setVocabFolders(data.id, entry.folderIds);
}
async function updateVocabRow(id, entry){
  const { error } = await sbClient.from('vocab').update({
    type: entry.type, latin: entry.latin, forms: entry.forms,
    meanings: entry.meanings, notes: entry.notes || ''
  }).eq('id', id);
  if(error) throw error;
  await setVocabFolders(id, entry.folderIds);
}
async function deleteVocabRow(id){
  const { error } = await sbClient.from('vocab').delete().eq('id', id);
  if(error) throw error;
}
async function bulkDeleteVocab(ids){
  if(!ids.length) return;
  const { error } = await sbClient.from('vocab').delete().in('id', ids);
  if(error) throw error;
}
async function bulkAddToFolder(ids, folderId){
  if(!folderId || ids.length===0) return;
  const { error } = await sbClient.from('vocab_folders').upsert(
    ids.map(id=>({ vocab_id: id, folder_id: folderId })),
    { onConflict: 'vocab_id,folder_id' }
  );
  if(error) throw error;
}
async function bulkRemoveFromFolder(ids, folderId){
  if(!folderId || ids.length===0) return;
  const { error } = await sbClient.from('vocab_folders').delete().eq('folder_id', folderId).in('vocab_id', ids);
  if(error) throw error;
}
async function insertFolder(name){
  const { error } = await sbClient.from('folders').insert({ name });
  if(error) throw error;
}
async function deleteFolderRow(id){
  const { error } = await sbClient.from('folders').delete().eq('id', id);

/* ---- Shared dictionary: a static CSV file living next to index.html on GitHub Pages.
   Everyone who visits the site loads the same file — no per-user upload needed.
   To update it, just edit dictionary.csv in the GitHub repo (e.g. via GitHub's
   web editor) and commit; every visitor gets the new version on their next load. */
let DICTIONARY_CACHE = null;
let DICTIONARY_LOAD_ERROR = false;
async function loadDictionary(){
  if(DICTIONARY_CACHE) return DICTIONARY_CACHE;
  try{
    const res = await fetch('dictionary.csv', { cache: 'no-cache' });
    if(!res.ok){ DICTIONARY_CACHE = []; DICTIONARY_LOAD_ERROR = true; return DICTIONARY_CACHE; }
    const text = await res.text();
    DICTIONARY_CACHE = csvToDictionaryRows(text);
  }catch(e){
    console.error('Wörterbuch konnte nicht geladen werden:', e);
    DICTIONARY_CACHE = [];
    DICTIONARY_LOAD_ERROR = true;
  }
  if(state.activeTab === 'pool') render();
  return DICTIONARY_CACHE;
}
function searchDictionaryLocal(prefix){
  const p = (prefix||'').trim().toLowerCase();
  if(!p || !DICTIONARY_CACHE) return [];
  return DICTIONARY_CACHE.filter(r => r.latin.toLowerCase().startsWith(p)).slice(0, 8);
}

/* ===================== HELPERS ===================== */
function normalize(s){
  return (s || '').toString().toLowerCase()
    .replace(/[.,;:!?¡¿'"„“”‚‘’`´]/g,'').replace(/\s+/g,' ').trim();
}
function normalizeGenus(s){
  const n = normalize(s);
  if(['m','maskulin','maskulinum','männlich','mannlich'].includes(n)) return 'm';
  if(['f','feminin','femininum','weiblich'].includes(n)) return 'f';
  if(['n','neutrum','sächlich','sachlich'].includes(n)) return 'n';
  return n;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function navigiumUrl(word){ return 'https://www.navigium.de/latein-woerterbuch.php?form=' + encodeURIComponent((word||'').trim()); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===================== AUDIO (ruhige generative Klaviermusik + angenehme Klänge) ===================== */
const AudioEngine = (function(){
  let ctx = null;
  let musicGain = null, sfxGain = null, musicIn = null, sfxIn = null;
  let noiseBuf = null;
  let session = null;      // laufende Musik-Sitzung
  let unlocked = false;

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function makeImpulse(seconds, decay){
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let c = 0; c < 2; c++){
      const d = buf.getChannelData(c);
      for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function ensureContext(){
    if(!ctx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      ctx = new Ctx();
      // Musik-Kette: Eingang -> weicher Tiefpass -> (trocken + Hall) -> Kompressor -> Lautstärke
      musicGain = ctx.createGain(); musicGain.gain.value = state.audio.musicVolume; musicGain.connect(ctx.destination);
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.ratio.value = 3; comp.connect(musicGain);
      musicIn = ctx.createGain();
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; lp.Q.value = 0.3;
      musicIn.connect(lp);
      const dry = ctx.createGain(); dry.gain.value = 0.55; lp.connect(dry); dry.connect(comp);
      const rev = ctx.createConvolver(); rev.buffer = makeImpulse(4.5, 2.6);
      const wet = ctx.createGain(); wet.gain.value = 0.7; lp.connect(rev); rev.connect(wet); wet.connect(comp);
      // Effekt-Kette mit kleinem Raumhall
      sfxGain = ctx.createGain(); sfxGain.gain.value = state.audio.sfxVolume; sfxGain.connect(ctx.destination);
      sfxIn = ctx.createGain(); sfxIn.connect(sfxGain);
      const srev = ctx.createConvolver(); srev.buffer = makeImpulse(1.4, 3);
      const swet = ctx.createGain(); swet.gain.value = 0.3; sfxIn.connect(srev); srev.connect(swet); swet.connect(sfxGain);
      // kurzer Rauschpuffer für Papier-/Karten-Geräusche
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.4), ctx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for(let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  /* ---------- Instrumente ---------- */
  // weiches "Filz-Klavier": Grundton + leise Obertöne, schneller Anschlag, langes Ausklingen
  function pianoNote(freq, t, vel, dur, dest){
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.012);
    g.gain.exponentialRampToValueAtTime(vel * 0.35, t + 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(dest);
    [[1, 'triangle', 1], [2, 'sine', 0.28], [3, 'sine', 0.09]].forEach(([mult, type, amp])=>{
      const o = ctx.createOscillator();
      o.type = type; o.frequency.value = freq * mult;
      o.detune.value = rand(-4, 4);
      const og = ctx.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  // warmer Klangteppich, langsames Ein- und Ausblenden
  function padChord(midis, t, dur, dest){
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650; lp.connect(dest);
    midis.forEach(m=>{
      [-5, 5].forEach(det=>{
        const o = ctx.createOscillator();
        o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = det;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.028, t + 2.6);
        g.gain.setValueAtTime(0.028, t + dur - 0.5);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 2.5);
        o.connect(g); g.connect(lp);
        o.start(t); o.stop(t + dur + 2.6);
      });
    });
  }
  function bassNote(midi, t, dur, dest){
    const f = mtof(midi);
    [[f, 'sine', 0.2], [f * 2, 'triangle', 0.07]].forEach(([fr, type, amp])=>{
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = fr;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp, t + 0.08);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }

  /* ---------- Musik: Akkordfolge in a-Moll / C-Dur, Arpeggien + sanfte Melodie ---------- */
  const CHORDS = [
    { bass: 45, tones: [57, 60, 64, 67, 71], pad: [57, 64, 67, 71] },   // Am9
    { bass: 41, tones: [53, 57, 60, 64, 67], pad: [53, 60, 64, 67] },   // Fmaj7
    { bass: 48, tones: [60, 64, 67, 71, 74], pad: [55, 64, 67, 71] },   // Cmaj9
    { bass: 43, tones: [55, 59, 62, 64, 69], pad: [55, 62, 64, 71] }    // G6/9
  ];
  const ALT_LAST = { bass: 40, tones: [52, 55, 59, 62, 67], pad: [52, 59, 62, 67] }; // Em7 als Abwechslung
  const MELODY = [67, 69, 72, 74, 76, 79, 81];
  const BEAT = 0.95;          // ruhiges Tempo (~63 BPM)
  const CHORD_BEATS = 8;

  function scheduleChord(s, chord, t0){
    const dest = s.fade;
    bassNote(chord.bass, t0, CHORD_BEATS * BEAT * 0.95, dest);
    padChord(chord.pad, t0, CHORD_BEATS * BEAT, dest);
    // Arpeggio: Achtelraster, nicht jeder Schlag wird gespielt -> luftig, nie mechanisch
    let last = -1;
    for(let slot = 0; slot < CHORD_BEATS * 2; slot++){
      const t = t0 + slot * BEAT / 2 + rand(-0.012, 0.012);
      const strong = slot % 4 === 0;
      if(!strong && Math.random() > 0.5) continue;
      let idx = Math.floor(Math.random() * chord.tones.length);
      if(idx === last) idx = (idx + 1) % chord.tones.length;
      last = idx;
      pianoNote(mtof(chord.tones[idx]), t, strong ? rand(0.13, 0.17) : rand(0.07, 0.12), 3.2, dest);
    }
    // gelegentlich eine ruhige, längere Melodienote
    [2, 6, 10, 13].forEach(slot=>{
      if(Math.random() < 0.55){
        s.mel = Math.max(0, Math.min(MELODY.length - 1, (s.mel === undefined ? 3 : s.mel) + pick([-2, -1, -1, 1, 1, 2])));
        pianoNote(mtof(MELODY[s.mel]), t0 + slot * BEAT / 2 + rand(0, 0.02), rand(0.11, 0.15), 4.5, dest);
      }
    });
  }

  function startMusic(){
    if(!ensureContext() || session) return;
    const fade = ctx.createGain();
    fade.gain.setValueAtTime(0.0001, ctx.currentTime);
    fade.gain.exponentialRampToValueAtTime(1, ctx.currentTime + 4);
    fade.connect(musicIn);
    const s = { fade, timer: null, step: 0, next: ctx.currentTime + 0.3 };
    session = s;
    const loop = () => {
      if(session !== s) return;
      let chord = CHORDS[s.step % CHORDS.length];
      if(s.step % CHORDS.length === 3 && Math.random() < 0.3) chord = ALT_LAST;
      scheduleChord(s, chord, s.next);
      s.next += CHORD_BEATS * BEAT;
      s.step++;
      const wait = Math.max(500, (s.next - ctx.currentTime - 1.5) * 1000);
      s.timer = setTimeout(loop, wait);
    };
    loop();
  }

  function stopMusic(){
    if(!session || !ctx) return;
    const s = session; session = null;
    clearTimeout(s.timer);
    const now = ctx.currentTime;
    try{ s.fade.gain.cancelScheduledValues(now); s.fade.gain.setValueAtTime(Math.max(s.fade.gain.value, 0.0001), now); s.fade.gain.exponentialRampToValueAtTime(0.0001, now + 1.2); }catch(e){}
  }

  function applyMusicState(){
    if(state.audio.musicEnabled) startMusic(); else stopMusic();
  }

  function setMusicVolume(v){ state.audio.musicVolume = v; if(musicGain) musicGain.gain.value = v; }
  function setSfxVolume(v){ state.audio.sfxVolume = v; if(sfxGain) sfxGain.gain.value = v; }

  /* ---------- Soundeffekte ---------- */
  function sfxOn(){ return state.audio.sfxEnabled && ensureContext(); }

  // glockenartiger, warmer Ton (Marimba/Glockenspiel-Mischung)
  function chime(midi, t, peak, dur){
    const f = mtof(midi);
    [[1, 1], [2, 0.32], [3, 0.12], [4.2, 0.05]].forEach(([mult, amp])=>{
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * mult;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak * amp, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur / mult);
      o.connect(g); g.connect(sfxIn);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  function swoosh(t, from, to, peak, dur){
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(from, t); bp.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(sfxIn);
    src.start(t); src.stop(t + dur + 0.02);
  }
  function thump(t, f0, f1, peak, dur){
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfxIn); o.start(t); o.stop(t + dur + 0.02);
  }

  // Karte umdrehen: ein einziges, sehr leises und kurzes Papier-Tippen
  function playFlip(){
    if(!sfxOn()) return; const t = ctx.currentTime;
    swoosh(t, 2000, 1300, 0.06, 0.07);
  }
  // Richtig: aufsteigendes, funkelndes Glockenspiel-Arpeggio
  function playCorrect(){
    if(!sfxOn()) return; const t = ctx.currentTime;
    [72, 76, 79, 84].forEach((m, i)=> chime(m, t + i * 0.075, 0.2 - i * 0.02, i === 3 ? 1.6 : 0.9));
    chime(91, t + 0.3, 0.05, 1.2);
  }
  // Falsch: weiches, tiefes "Blub" ohne Schärfe
  function playIncorrect(){
    if(!sfxOn()) return; const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(330, t); o.frequency.exponentialRampToValueAtTime(220, t + 0.28);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    o.connect(lp); lp.connect(g); g.connect(sfxIn); o.start(t); o.stop(t + 0.45);
  }
  // Gespeichert: kleines, freundliches "Ding-Ding"
  function playSave(){
    if(!sfxOn()) return; const t = ctx.currentTime;
    chime(79, t, 0.18, 0.7); chime(86, t + 0.09, 0.16, 1.1);
  }
  // Tab-Wechsel: kaum hörbares, sanftes Tippen
  function playTick(){
    if(!sfxOn()) return; const t = ctx.currentTime;
    thump(t, 520, 340, 0.10, 0.06);
  }

  // Der erste Tipp/Klick entsperrt den AudioContext (Browser-Autoplay-Regel, besonders streng auf iPad)
  function unlockOnFirstInteraction(){
    if(unlocked) return;
    unlocked = true;
    ensureContext();
    applyMusicState();
  }
  document.addEventListener('click', unlockOnFirstInteraction, { once:true });
  document.addEventListener('touchend', unlockOnFirstInteraction, { once:true });
  document.addEventListener('keydown', unlockOnFirstInteraction, { once:true });

  return { ensureContext, applyMusicState, setMusicVolume, setSfxVolume, playFlip, playCorrect, playIncorrect, playSave, playTick };
})();

/* ---- CSV parsing for the dictionary import ---- */
function parseCsv(text){
  const rows = [];
  let i = 0, field = '', row = [], inQuotes = false;
  const pushField = () => { row.push(field); field = ''; };
  const pushRow = () => { pushField(); rows.push(row); row = []; };
  while(i < text.length){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    } else {
      if(c === '"'){ inQuotes = true; i++; continue; }
      if(c === ';'){ pushField(); i++; continue; }
      if(c === '\r'){ i++; continue; }
      if(c === '\n'){ pushRow(); i++; continue; }
      field += c; i++; continue;
    }
  }
  if(field.length || row.length) pushRow();
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
}

function csvToDictionaryRows(text){
  const rows = parseCsv(text);
  if(rows.length < 2) return [];
  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = name => header.indexOf(name);
  const iWortart = idx('wortart'), iLatein = idx('latein'), iPraesens = idx('praesens'),
        iPerfekt = idx('perfekt'), iPpp = idx('ppp'), iGenitiv = idx('genitiv'), iGenus = idx('genus'),
        iNomF = idx('nomsgf'), iNomN = idx('nomsgn'), iBedeutungen = idx('bedeutungen'),
        iBemerkungen = idx('bemerkungen');
  const typeMap = { verb:'verb', substantiv:'noun', nomen:'noun', adjektiv:'adjective', sonstiges:'other' };
  const out = [];
  for(let r = 1; r < rows.length; r++){
    const row = rows[r];
    if(!row || row.every(c => !c || !c.trim())) continue;
    const latin = ((iLatein > -1 ? row[iLatein] : '') || '').trim();
    if(!latin) continue;
    const wortartRaw = ((iWortart > -1 ? row[iWortart] : '') || '').trim().toLowerCase();
    const type = typeMap[wortartRaw] || 'other';
    const forms = {};
    if(type === 'verb'){
      if(iPraesens > -1) forms.praesens = (row[iPraesens]||'').trim();
      if(iPerfekt > -1) forms.perfekt = (row[iPerfekt]||'').trim();
      if(iPpp > -1) forms.ppp = (row[iPpp]||'').trim();
    } else if(type === 'noun'){
      if(iGenitiv > -1) forms.genitiv = (row[iGenitiv]||'').trim();
      if(iGenus > -1){ const g = (row[iGenus]||'').trim(); if(g) forms.genus = normalizeGenus(g); }
    } else if(type === 'adjective'){
      if(iNomF > -1) forms.nomF = (row[iNomF]||'').trim();
      if(iNomN > -1) forms.nomN = (row[iNomN]||'').trim();
      if(iGenitiv > -1){ const g = (row[iGenitiv]||'').trim(); if(g) forms.genitiv = g; } // one-termination adjectives (e.g. felix, felicis)
    }
    const meanings = iBedeutungen > -1 ? (row[iBedeutungen]||'').split(',').map(m=>m.trim()).filter(Boolean) : [];
    const notes = iBemerkungen > -1 ? (row[iBemerkungen]||'').trim() : '';
    out.push({ type, latin, forms, meanings, notes });
  }
  return out;
}

function translateAuthError(msg){
  if(!msg) return 'Unbekannter Fehler.';
  if(msg.includes('Invalid login credentials')) return 'E-Mail oder Passwort ist falsch.';
  if(msg.includes('User already registered')) return 'Für diese E-Mail existiert bereits ein Konto — einfach anmelden.';
  if(msg.includes('Password should be at least')) return 'Das Passwort muss mindestens 6 Zeichen lang sein.';
  if(msg.includes('Unable to validate email')) return 'Diese E-Mail-Adresse scheint ungültig zu sein.';
  if(msg.includes('New password should be different')) return 'Das neue Passwort muss sich vom alten unterscheiden.';
  if(msg.includes('session') && msg.includes('expired')) return 'Der Link ist abgelaufen. Fordere einen neuen Link zum Zurücksetzen an.';
  return msg;
}

/* Basic format check plus a DNS lookup (via Google's public DNS-over-HTTPS API) confirming the
   domain actually has mail servers, before we ever hand the address to Supabase. This can't
   prove the exact mailbox exists (only Supabase's own confirmation e-mail can do that), but it
   reliably catches typos and made-up domains. If the DNS check itself is unreachable, we don't
   block signup over it — better to let a real user through than to lock everyone out. */
function isPlausibleEmailFormat(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}
async function domainCanReceiveMail(domain){
  try{
    const res = await fetch('https://dns.google/resolve?name=' + encodeURIComponent(domain) + '&type=MX');
    if(!res.ok) return true; // fail open
    const data = await res.json();
    if(data.Answer && data.Answer.length > 0) return true;
    // some domains route mail via an A/AAAA record instead of MX — check as a fallback
    const res2 = await fetch('https://dns.google/resolve?name=' + encodeURIComponent(domain) + '&type=A');
    if(!res2.ok) return true;
    const data2 = await res2.json();
    return !!(data2.Answer && data2.Answer.length > 0);
  }catch(e){
    return true; // fail open — never block signup because a network check failed
  }
}

  state.dictSuggestions = [];

function bindAuthEvents(){
  if(state.forgotPasswordOpen){ bindForgotPasswordEvents(); return; }
  document.querySelectorAll('[data-auth-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.authMode = btn.dataset.authTab;
      state.authError = ''; state.authNotice = '';
      render();
    });
  });
  const forgotLink = document.getElementById('forgotPasswordLink');
  if(forgotLink) forgotLink.addEventListener('click', ()=>{
    state.forgotPasswordOpen = true;
    state.forgotError = ''; state.forgotNotice = '';
    render();
  });
  document.getElementById('authForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    state.authError = ''; state.authNotice = ''; state.authBusy = true;
    render();
    try{
      if(state.authMode === 'login'){
        const { error } = await sbClient.auth.signInWithPassword({ email, password });
        if(error) throw error;
      } else {
        if(!isPlausibleEmailFormat(email)){
          throw new Error('Bitte eine gültige E-Mail-Adresse eingeben.');
        }
        const domain = email.split('@')[1];
        const domainOk = await domainCanReceiveMail(domain);
        if(!domainOk){
          throw new Error('Für die Domain „' + domain + '" wurden keine Mailserver gefunden. Bitte die E-Mail-Adresse auf Tippfehler prüfen.');
        }
        const { data, error } = await sbClient.auth.signUp({ email, password });
        if(error) throw error;
        if(data && data.session){
          // Email confirmation disabled -> logged in immediately
        } else {
          state.authNotice = 'Konto erstellt! Falls in deinem Supabase-Projekt die E-Mail-Bestätigung aktiv ist, bestätige zuerst deine Adresse und melde dich dann an.';
          state.authMode = 'login';
        }
      }
    }catch(err){
      state.authError = translateAuthError(err.message);
    }
    state.authBusy = false;
    render();
  });
}

function bindForgotPasswordEvents(){
  document.getElementById('backToLoginBtn').addEventListener('click', ()=>{
    state.forgotPasswordOpen = false;
    state.forgotError = ''; state.forgotNotice = '';
    render();
  });
  document.getElementById('forgotForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const email = document.getElementById('forgotEmailInput').value.trim();
    state.forgotEmail = email;
    state.forgotError = ''; state.forgotNotice = ''; state.forgotBusy = true;
    render();
    try{
      const { error } = await sbClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
      if(error) throw error;
      state.forgotNotice = 'Falls ein Konto mit dieser Adresse existiert, wurde eine E-Mail mit einem Link zum Zurücksetzen verschickt.';
    }catch(err){
      state.forgotError = translateAuthError(err.message);
    }
    state.forgotBusy = false;
    render();
  });
}

function bindRecoveryEvents(){
  document.getElementById('recoveryForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const pw = document.getElementById('recoveryPassword').value;
    const pwConfirm = document.getElementById('recoveryPasswordConfirm').value;
    state.recoveryError = ''; state.recoveryNotice = '';
    if(pw !== pwConfirm){ state.recoveryError = 'Die Passwörter stimmen nicht überein.'; render(); return; }
    state.recoveryBusy = true;
    render();
    try{
      const { error } = await sbClient.auth.updateUser({ password: pw });
      if(error) throw error;
      state.authView = 'normal';
      state.recoveryError = ''; state.recoveryNotice = '';
      state.activeTab = 'add';
      if(state.user) await loadPool();
    }catch(err){
      state.recoveryError = translateAuthError(err.message);
    }
    state.recoveryBusy = false;
    render();
  });
}

async function handleLogout(){
  await sbClient.auth.signOut();

  resetDraft();
  render();
}

function bindAddTabEvents(){
  const form = document.getElementById('vocabForm');
  if(!form) return;

  document.querySelectorAll('[data-context]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const fid = btn.dataset.context;
      const idx = state.draftFolderIds.indexOf(fid);
      if(idx > -1) state.draftFolderIds.splice(idx,1); else state.draftFolderIds.push(fid);
      state.quickAddFolderOpen = false;
      render();
    });
  });
  const quickAddBtn = document.getElementById('quickAddFolderBtn');
  if(quickAddBtn) quickAddBtn.addEventListener('click', ()=>{
    state.quickAddFolderOpen = !state.quickAddFolderOpen;
    render();
    const inp = document.getElementById('quickFolderName');
    if(inp) inp.focus();
  });
  const quickCreateBtn = document.getElementById('quickFolderCreate');
  if(quickCreateBtn) quickCreateBtn.addEventListener('click', async ()=>{
    const name = document.getElementById('quickFolderName').value.trim();
    if(!name) return;
    try{
      await insertFolder(name);
      await loadPool();
      const created = state.folders.find(f=>f.name===name);
      if(created) state.draftFolderIds.push(created.id);
      state.quickAddFolderOpen = false;
      render();
    }catch(err){ console.error(err); alert('Ordner konnte nicht erstellt werden: ' + err.message); }
  });

  document.getElementById('latinInput').addEventListener('input', e=>{
    state.draftLatin = e.target.value;
    document.getElementById('navigiumLink').href = navigiumUrl(e.target.value);
    state.dictActiveIndex = -1;
    const word = e.target.value.trim();
    renderDictSuggestionsInto(word.length < 2 ? [] : searchDictionaryLocal(word));
  });
  document.getElementById('latinInput').addEventListener('blur', ()=>{
    setTimeout(()=>{ renderDictSuggestionsInto([]); }, 150);
  });
  document.getElementById('latinInput').addEventListener('keydown', e=>{
    if(!state.dictSuggestions.length) return;
    if(e.key === 'ArrowDown'){
      e.preventDefault(); e.stopPropagation();
      state.dictActiveIndex = Math.min(state.dictActiveIndex + 1, state.dictSuggestions.length - 1);
      highlightDictSuggestion();
    } else if(e.key === 'ArrowUp'){
      e.preventDefault(); e.stopPropagation();
      state.dictActiveIndex = Math.max(state.dictActiveIndex - 1, -1);
      highlightDictSuggestion();
    } else if(e.key === 'Enter'){
      if(state.dictActiveIndex > -1){
        e.preventDefault(); e.stopPropagation();
        applyDictSuggestion(state.dictSuggestions[state.dictActiveIndex]);
      }
    } else if(e.key === 'Escape'){
      renderDictSuggestionsInto([]);
    }
  });

  document.querySelectorAll('#typeSegmented button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.draftType = btn.dataset.type;
      state.draftForms = {};
      render();
      document.getElementById('latinInput').focus();
    });
  });

  document.querySelectorAll('[data-form-key]').forEach(inp=>{
    inp.addEventListener('input', e=>{ state.draftForms[e.target.dataset.formKey] = e.target.value; });
  });

  document.getElementById('meaningsList').addEventListener('input', e=>{
    const idx = e.target.dataset.meaningIdx;
    if(idx !== undefined) state.meaningsDraft[idx] = e.target.value;
  });
  document.getElementById('notesInput').addEventListener('input', e=>{ state.draftNotes = e.target.value; });
  document.querySelectorAll('[data-remove-meaning]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.meaningsDraft.splice(parseInt(btn.dataset.removeMeaning,10),1); render(); });
  });
  document.getElementById('addMeaningBtn').addEventListener('click', ()=>{
    if(state.meaningsDraft.length < 6){
      state.meaningsDraft.push('');
      render();
      const inputs = document.querySelectorAll('#meaningsList input');
      inputs[inputs.length-1].focus();
    }
  });

  const cancelBtn = document.getElementById('cancelEditBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ resetDraft(); render(); });

  // Enter-Taste springt zum nächsten Eingabefeld statt das Formular abzuschicken
  form.addEventListener('keydown', e=>{
    if(e.key !== 'Enter') return;
    if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') return;
    e.preventDefault();
    const focusable = Array.from(form.querySelectorAll('input, select')).filter(el=>!el.disabled);
    const idx = focusable.indexOf(e.target);
    if(idx > -1 && idx < focusable.length - 1){
      const next = focusable[idx+1];
      next.focus();
      if(next.select) next.select();
    } else {
      form.dispatchEvent(new Event('submit', {cancelable:true, bubbles:true}));
    }
  });

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    state.errors = {};

    const latin = (state.draftLatin||'').trim();
    if(!latin) state.errors['latin'] = 'Bitte eine Vokabel eingeben.';

    const type = state.draftType || 'verb';
    const fieldDefs = formFieldsFor(type);
    const forms = {};
    fieldDefs.forEach(f=>{
      let val = (state.draftForms[f.key]||'').trim();
      if(f.key === 'genus' && val){
        const norm = normalizeGenus(val);
        if(['m','f','n'].includes(norm)) val = norm;
        else state.errors['form:'+f.key] = 'Bitte m, f oder n eingeben (oder maskulin/feminin/neutrum).';
      }
      forms[f.key] = val;
      if(f.required && !val && !state.errors['form:'+f.key]) state.errors['form:'+f.key] = 'Diese Form wird benötigt.';
    });

    const meanings = state.meaningsDraft.map(m=>m.trim()).filter(Boolean);
    if(meanings.length===0) state.errors['meanings'] = 'Bitte mindestens eine Bedeutung angeben.';

    if(Object.keys(state.errors).length > 0){ render(); return; }

    const entry = { type, latin, forms, meanings, notes: (state.draftNotes||'').trim(), folderIds: state.draftFolderIds.slice() };
    try{
      const keepFolderIds = entry.folderIds.slice();
      if(state.editingId !== null) await updateVocabRow(state.editingId, entry);
      else await insertVocab(entry);
      await loadPool();
      resetDraft();
      state.draftFolderIds = keepFolderIds;
      AudioEngine.playSave();
      render();
    }catch(err){
      console.error(err);
      state.errors['latin'] = 'Speichern fehlgeschlagen: ' + err.message;
      render();
    }
  });
}

/* ===================== POOL TAB ===================== */
function sortedPool(list){
  const arr = list.slice();
  if(state.poolSort === 'type') arr.sort((a,b)=> TYPE_LABELS[a.type].localeCompare(TYPE_LABELS[b.type],'de') || a.latin.localeCompare(b.latin,'de'));
  else if(state.poolSort === 'created') arr.sort((a,b)=> new Date(b.createdAt||0) - new Date(a.createdAt||0));
  else arr.sort((a,b)=>a.latin.localeCompare(b.latin,'de'));
  return arr;
}

const POOL_PAGE_SIZE = 15;

function renderPoolTab(){
  const allEntries = sortedPool(
    state.pool
      .filter(v => v.latin.toLowerCase().includes(state.poolFilter.toLowerCase()))
      .filter(v => !state.poolFolderFilter || (v.folderIds||[]).includes(state.poolFolderFilter))
  );
  const totalPages = Math.max(1, Math.ceil(allEntries.length / POOL_PAGE_SIZE));
  if(state.poolPage > totalPages) state.poolPage = totalPages;
  if(state.poolPage < 1) state.poolPage = 1;
  const pageStart = (state.poolPage - 1) * POOL_PAGE_SIZE;
  const listEntries = allEntries.slice(pageStart, pageStart + POOL_PAGE_SIZE);

  const poolItems = listEntries.map(v => `
      <div class="pool-item compact${state.poolSelectMode ? ' selectable' : ''}${state.poolSelectMode && state.poolSelected[v.id] ? ' selected' : ''}" ${state.poolSelectMode ? `data-row="${v.id}"` : ''}>
        ${state.poolSelectMode ? `<input type="checkbox" class="pool-checkbox" data-select-vocab="${v.id}" tabindex="-1" ${state.poolSelected[v.id]?'checked':''}>` : ''}
        <span class="lw">${escapeHtml(v.latin)}</span>
        <span class="meta">${TYPE_LABELS[v.type]} · ${escapeHtml(v.meanings.join(', '))}</span>
        ${v.notes ? `<span class="folder-chip" title="${escapeHtml(v.notes)}">📝</span>` : ''}
        ${(v.folderIds||[]).map(fid => folderName(fid) ? `<span class="folder-chip">${escapeHtml(folderName(fid))}</span>` : '').join('')}
        <span class="actions">
          <button data-edit="${v.id}" title="Bearbeiten">✎</button>
          <button data-delete="${v.id}" title="Löschen">🗑</button>
        </span>
      </div>
    `).join('');

  const selectedIds = Object.keys(state.poolSelected).filter(id => state.poolSelected[id] && state.pool.some(v=>v.id===id));
  const allVisibleSelected = listEntries.length>0 && listEntries.every(v=>state.poolSelected[v.id]);

  const bulkBar = (state.poolSelectMode && selectedIds.length) ? `
    <div class="bulk-bar">
      <span>${selectedIds.length} ausgewählt</span>
      <select id="bulkFolderSelect">
        <option value="" ${!state.bulkTargetFolder?'selected':''}>Ordner wählen…</option>
        ${state.folders.map(f=>`<option value="${f.id}" ${state.bulkTargetFolder===f.id?'selected':''}>${escapeHtml(f.name)}</option>`).join('')}
      </select>
      <button type="button" class="btn small" id="bulkAddBtn">Zu Ordner hinzufügen</button>
      <button type="button" class="btn secondary small" id="bulkRemoveBtn">Aus Ordner entfernen</button>
      <button type="button" class="btn secondary small" id="bulkClearBtn">Auswahl aufheben</button>
      <button type="button" class="btn danger small" id="bulkDeleteBtn">Ausgewählte löschen</button>
    </div>
  ` : '';

  const paginationBar = allEntries.length > POOL_PAGE_SIZE ? `
    <div class="pagination-row">
      <button type="button" class="btn secondary small" id="poolPrevPage" ${state.poolPage<=1?'disabled':''}>◀ Zurück</button>
      <span>Seite ${state.poolPage} / ${totalPages}</span>
      <button type="button" class="btn secondary small" id="poolNextPage" ${state.poolPage>=totalPages?'disabled':''}>Weiter ▶</button>
    </div>
  ` : '';

  return `
    <div class="panel">
      <h2 class="section-title">
        Vokabelpool (${state.pool.length})
        ${state.pool.length ? `<button type="button" class="btn secondary small" id="toggleSelectMode">${state.poolSelectMode ? 'Fertig' : 'Auswählen'}</button>` : ''}
      </h2>
      ${state.pool.length ? `
        <div class="filter-row">
          <input type="text" id="poolSearch" placeholder="Vokabel suchen…" value="${escapeHtml(state.poolFilter)}">
          <select id="poolFolderFilter">
            <option value="" ${!state.poolFolderFilter?'selected':''}>Alle Ordner</option>
            ${state.folders.map(f=>`<option value="${f.id}" ${state.poolFolderFilter===f.id?'selected':''}>${escapeHtml(f.name)}</option>`).join('')}
          </select>
          <select id="poolSort">
            <option value="latin" ${state.poolSort==='latin'?'selected':''}>Alphabetisch</option>
            <option value="type" ${state.poolSort==='type'?'selected':''}>Nach Wortart</option>
            <option value="created" ${state.poolSort==='created'?'selected':''}>Zuletzt hinzugefügt</option>
          </select>
        </div>
        ${state.poolSelectMode ? `
        <div class="select-all-row">
          <label><input type="checkbox" id="selectAllPool" ${allVisibleSelected?'checked':''}> Alle sichtbaren auswählen</label>
        </div>
        ` : ''}
        ${bulkBar}
      ` : ''}
      <div class="pool-list">
        ${state.pool.length ? (poolItems || '<div class="empty-note">Keine Treffer.</div>') : '<div class="empty-note">Noch keine Vokabeln — füge zuerst welche hinzu.</div>'}
      </div>
      ${paginationBar}
    </div>

    <div class="panel">
      <h2 class="section-title">Ordner verwalten</h2>
      <div class="folder-manage-row">
        <input type="text" id="newFolderName" placeholder="Neuer Ordner, z. B. „Lektion 4“">
        <button type="button" class="btn small" id="createFolderBtn">Erstellen</button>
      </div>
      <div class="folder-tag-list">
        ${state.folders.length ? state.folders.map(f=>`
          <span class="folder-tag">${escapeHtml(f.name)}
            <button type="button" data-delete-folder="${f.id}" title="Ordner löschen">✕</button>
          </span>
        `).join('') : '<span class="empty-note">Noch keine Ordner angelegt.</span>'}
      </div>

    if(!state.poolSelectMode) state.poolSelected = {};

  });

    el2.focus(); el2.setSelectionRange(pos, pos);

      if(e.target.checked) state.poolSelected[cb.dataset.selectVocab] = true;
      else delete state.poolSelected[cb.dataset.selectVocab];

  });
  const bulkFolderSelect = document.getElementById('bulkFolderSelect');
  if(bulkFolderSelect) bulkFolderSelect.addEventListener('change', e=>{ state.bulkTargetFolder = e.target.value; });
  const bulkAddBtn = document.getElementById('bulkAddBtn');
  if(bulkAddBtn) bulkAddBtn.addEventListener('click', async ()=>{
    const ids = Object.keys(state.poolSelected).filter(id=>state.poolSelected[id]);
    if(ids.length===0 || !state.bulkTargetFolder) return;
    try{
      await bulkAddToFolder(ids, state.bulkTargetFolder);
      await loadPool();
      render();
    }catch(err){ console.error(err); alert('Hinzufügen fehlgeschlagen: ' + err.message); }
  });
  const bulkRemoveBtn = document.getElementById('bulkRemoveBtn');
  if(bulkRemoveBtn) bulkRemoveBtn.addEventListener('click', async ()=>{
    const ids = Object.keys(state.poolSelected).filter(id=>state.poolSelected[id]);
    if(ids.length===0 || !state.bulkTargetFolder) return;
    try{
      await bulkRemoveFromFolder(ids, state.bulkTargetFolder);
      await loadPool();
      render();
    }catch(err){ console.error(err); alert('Entfernen fehlgeschlagen: ' + err.message); }
  });
  const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
  if(bulkDeleteBtn) bulkDeleteBtn.addEventListener('click', async ()=>{
    const ids = Object.keys(state.poolSelected).filter(id=>state.poolSelected[id]);
    if(ids.length===0) return;
    const msg = ids.length + (ids.length===1 ? ' Vokabel' : ' Vokabeln') + ' wirklich löschen? Das kann nicht rückgängig gemacht werden.';
    if(!confirm(msg)) return;
    try{
      await bulkDeleteVocab(ids);
      if(ids.includes(state.editingId)) resetDraft();
      state.poolSelected = {};
      await loadPool();
      render();
    }catch(err){ console.error(err); alert('Löschen fehlgeschlagen: ' + err.message); }
  });
  const bulkClearBtn = document.getElementById('bulkClearBtn');
  if(bulkClearBtn) bulkClearBtn.addEventListener('click', ()=>{ state.poolSelected = {}; render(); });

  document.getElementById('createFolderBtn').addEventListener('click', async ()=>{
    const nameInput = document.getElementById('newFolderName');
    const name = nameInput.value.trim();
    if(!name) return;
    try{ await insertFolder(name); await loadPool(); render(); }
    catch(err){ console.error(err); alert('Ordner konnte nicht erstellt werden: ' + err.message); }
  });
  document.querySelectorAll('[data-delete-folder]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const fid = btn.dataset.deleteFolder;
      try{
        await deleteFolderRow(fid);
        state.draftFolderIds = state.draftFolderIds.filter(id=>id!==fid);
        if(state.poolFolderFilter===fid) state.poolFolderFilter = '';
        if(state.bulkTargetFolder===fid) state.bulkTargetFolder = '';
        await loadPool();
        render();
      }catch(err){ console.error(err); }
    });
  });

  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      startEditEntry(state.pool.find(x=>x.id===btn.dataset.edit));
      setActiveTab('add');
    });
  });
  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        await deleteVocabRow(btn.dataset.delete);
        if(state.editingId===btn.dataset.delete) resetDraft();
        delete state.poolSelected[btn.dataset.delete];
        await loadPool();
        render();
      }catch(err){ console.error(err); }
    });
  });
}

/* Auswahl wie im Datei-Manager: Klick/Tipp auf die ganze Zeile, gedrückt halten und ziehen wählt mehrere aus.
   Am iPad: kurz gedrückt halten, dann ziehen. Während des Ziehens wird nur das DOM aktualisiert, erst am Ende neu gerendert. */
function bindPoolDragSelect(){
  const list = document.querySelector('.pool-list');
  if(!list) return;
  const rows = () => Array.from(list.querySelectorAll('[data-row]'));
  let drag = null, raf = null, pt = { x:0, y:0 };

  function paint(){
    rows().forEach(r=>{
      const on = !!state.poolSelected[r.dataset.row];
      r.classList.toggle('selected', on);
      const cb = r.querySelector('.pool-checkbox'); if(cb) cb.checked = on;
    });
  }
  function applyRange(cur){
    const lo = Math.min(drag.start, cur), hi = Math.max(drag.start, cur);
    drag.ids.forEach((id, i)=>{
      const on = (i >= lo && i <= hi) ? drag.target : !!drag.baseline[id];
      if(on) state.poolSelected[id] = true; else delete state.poolSelected[id];
    });
    paint();
  }
  function begin(row){
    const ids = rows().map(r=>r.dataset.row);
    const start = ids.indexOf(row.dataset.row);
    drag = { ids, start, target: !state.poolSelected[ids[start]], baseline: Object.assign({}, state.poolSelected) };
    applyRange(start);
  }
  function moveTo(x, y){
    if(!drag) return;
    const el = document.elementFromPoint(x, y);
    const row = el && el.closest ? el.closest('[data-row]') : null;
    if(row && list.contains(row)){ applyRange(drag.ids.indexOf(row.dataset.row)); return; }
    const els = rows(); if(!els.length) return;
    if(y < els[0].getBoundingClientRect().top) applyRange(0);
    else if(y > els[els.length-1].getBoundingClientRect().bottom) applyRange(els.length-1);
  }
  function autoScroll(){
    if(!drag){ raf = null; return; }
    const m = 70; let dy = 0;
    if(pt.y < m) dy = -Math.ceil((m - pt.y) / 6);
    else if(pt.y > window.innerHeight - m) dy = Math.ceil((pt.y - (window.innerHeight - m)) / 6);
    if(dy){ window.scrollBy(0, dy); moveTo(pt.x, pt.y); }
    raf = requestAnimationFrame(autoScroll);
  }
  function finish(){
    if(!drag) return;
    drag = null;
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    render();
  }

  // Maus / Trackpad
  list.addEventListener('pointerdown', e=>{
    if(e.pointerType !== 'mouse' || e.button !== 0) return;
    if(e.target.closest('.actions')) return;
    const row = e.target.closest('[data-row]'); if(!row) return;
    e.preventDefault();
    begin(row);
    pt = { x:e.clientX, y:e.clientY };
    raf = requestAnimationFrame(autoScroll);
    const onMove = ev=>{ pt = { x:ev.clientX, y:ev.clientY }; moveTo(pt.x, pt.y); };
    const onUp = ()=>{
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      finish();
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });

  // Touch (iPad): Tipp = umschalten, kurz halten + ziehen = Bereich auswählen, Scrollen bleibt normal möglich
  let touch = null;
  list.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1 || e.target.closest('.actions')) return;
    const row = e.target.closest('[data-row]'); if(!row) return;
    const t = e.touches[0];
    touch = { row, x:t.clientX, y:t.clientY, active:false, moved:false };
    const me = touch;
    me.timer = setTimeout(()=>{
      if(touch !== me || me.moved) return;
      me.active = true; begin(me.row); pt = { x:me.x, y:me.y };
      raf = requestAnimationFrame(autoScroll);
      if(navigator.vibrate) navigator.vibrate(8);
    }, 280);
  }, { passive:true });
  list.addEventListener('touchmove', e=>{
    if(!touch) return;
    const t = e.touches[0];
    if(!touch.active){
      if(Math.hypot(t.clientX - touch.x, t.clientY - touch.y) > 10){ touch.moved = true; clearTimeout(touch.timer); }
      return;
    }
    e.preventDefault();
    pt = { x:t.clientX, y:t.clientY }; moveTo(pt.x, pt.y);
  }, { passive:false });
  list.addEventListener('touchend', e=>{
    if(!touch) return;
    const me = touch; touch = null; clearTimeout(me.timer);
    if(me.active){ e.preventDefault(); finish(); }
    else if(!me.moved){ e.preventDefault(); begin(me.row); finish(); }
  }, { passive:false });
  list.addEventListener('touchcancel', ()=>{
    if(!touch) return;
    const me = touch; touch = null; clearTimeout(me.timer);
    if(me.active) finish();
  });
}

function renderPracticeTab(){

    return `<div class="panel"><div class="empty-state"><div class="big-word">Leerer Pool</div>Füge zuerst ein paar Vokabeln hinzu.</div></div>`;
  }
  const filtered = poolByFolder(state.practice.folderId);

    <select class="folder-select" id="practiceFolderSelect">
      <option value="" ${!state.practice.folderId?'selected':''}>Alle Ordner</option>
      ${state.folders.map(f=>`<option value="${f.id}" ${state.practice.folderId===f.id?'selected':''}>${escapeHtml(f.name)}</option>`).join('')}

  if(filtered.length===0){
    return `<div class="panel practice-wrap"><div class="practice-top-row"><span></span>${folderSelectHtml}</div>
      <div class="empty-state"><div class="big-word">Keine Vokabeln</div>In diesem Ordner sind keine Vokabeln.</div></div>`;
  }

  if(state.practice.order.length===0 || !state.practice.order.every(id => filtered.some(v=>v.id===id))){

      <div class="practice-top-row">

            <div class="type-tag">${TYPE_LABELS[v.type]}</div>

            <div class="meanings">${escapeHtml(v.meanings.join(', '))}</div>
            ${v.notes ? `<div class="card-notes">${escapeHtml(v.notes)}</div>` : ''}
          </div>
        </div>

    state.practice.flipped = false; render();
  });

  if(state.pool.length===0){

  const max = Math.max(filtered.length, 1);
  if(state.test.settings.count > filtered.length) state.test.settings.count = filtered.length || 1;
  if(state.test.settings.count < 1) state.test.settings.count = Math.min(1, filtered.length);

  return `
    <div class="panel">
      <h2 class="section-title">Test-Einstellungen</h2>
      <div class="settings-row">
        <div>
          <label class="field-label">Ordner</label>
          <select class="select-field" id="testFolderSelect">
            <option value="" ${!state.test.settings.folderId?'selected':''}>Alle Ordner (${state.pool.length})</option>
            ${state.folders.map(f=>`<option value="${f.id}" ${state.test.settings.folderId===f.id?'selected':''}>${escapeHtml(f.name)} (${poolByFolder(f.id).length})</option>`).join('')}
          </select>
        </div>
        ${filtered.length===0 ? '<div class="empty-note">In diesem Ordner sind keine Vokabeln.</div>' : `
        <div>
          <label class="field-label">Anzahl abgefragter Vokabeln</label>
          <div class="slider-row">
            <input type="range" id="countSlider" min="1" max="${max}" value="${state.test.settings.count}">

          </div>
        </div>
        <div class="settings-group">
          <div class="toggle-row">
            <div><div class="label">Formen abfragen</div><div class="desc">Stammformen, Genitiv/Genus bzw. Adjektivformen mit abfragen</div></div>

          </div>
          <div class="meanings-row">
            <div class="label">Bedeutungen abfragen</div>
            <div class="segmented" id="meaningsModeSegmented">
              <button type="button" data-meaningsmode="one" class="${state.test.settings.meaningsMode==='one'?'active':''}">Eine</button>
              <button type="button" data-meaningsmode="random" class="${state.test.settings.meaningsMode==='random'?'active':''}">Zufällig (1–3)</button>
              <button type="button" data-meaningsmode="all" class="${state.test.settings.meaningsMode==='all'?'active':''}">Alle</button>
            </div>
          </div>
        </div>`}

    </div>

function meaningCountFor(v, mode){
  const total = v.meanings.length;
  if(total === 0) return 0;
  if(mode === 'one') return 1;
  if(mode === 'all') return total;
  const cap = Math.min(3, total);
  return 1 + Math.floor(Math.random() * cap); // 'random': somewhere between 1 and min(3, total)
}

function buildQuestionFor(v){
  const fields = state.test.settings.withForms ? formFieldsFor(v.type).filter(f => v.forms[f.key]) : [];
  const meaningCount = meaningCountFor(v, state.test.settings.meaningsMode);
  return { id: v.id, fields, meaningCount };
}

function renderTestQuestion(){
  const q = state.test.queue[state.test.idx];
  const v = state.pool.find(x=>x.id===q.id);
  const checked = state.test.checked;
  const answers = state.test.answers;

  const fieldsHtml = q.fields.map(f=>{
    const key = 'field:'+f.key;
    const val = answers[key] || '';
    if(!checked){
      return `<div class="answer-input-row"><label class="field-label">${f.label}</label>
        <input type="text" data-answer="${key}" value="${escapeHtml(val)}"></div>`;
    }
    const correct = f.key==='genus' ? normalizeGenus(val)===normalizeGenus(v.forms[f.key]) : normalize(val)===normalize(v.forms[f.key]);
    const inner = correct
      ? `<span>${escapeHtml(val)}</span><span class="check-icon">✓</span>`
      : `${val.trim() ? `<span class="wrong-strike">${escapeHtml(val)}</span>` : ''}<span class="correct-fill">${escapeHtml(v.forms[f.key])}</span>`;
    return `<div class="answer-input-row"><label class="field-label">${f.label}</label>
      <div class="answer-display ${correct?'correct':'incorrect'}">${inner}</div></div>`;
  }).join('');

  const correctMeaningsNorm = checked ? gradeMeaningsForDisplay(v.meanings, q.meaningCount, answers) : null;
  const meaningsHtml = Array.from({length:q.meaningCount}).map((_,i)=>{
    const key = 'meaning:'+i;
    const val = answers[key] || '';
    if(!checked){
      return `<div class="answer-input-row"><input type="text" data-answer="${key}" value="${escapeHtml(val)}" placeholder="Bedeutung ${i+1}"></div>`;
    }
    const isCorrect = correctMeaningsNorm.results[i];
    const suggestion = correctMeaningsNorm.suggestions[i];
    const inner = isCorrect
      ? `<span>${escapeHtml(val)}</span><span class="check-icon">✓</span>`
      : `${val.trim() ? `<span class="wrong-strike">${escapeHtml(val)}</span>` : ''}<span class="correct-fill">${escapeHtml(suggestion||'')}</span>`;
    return `<div class="answer-input-row"><div class="answer-display ${isCorrect?'correct':'incorrect'}">${inner}</div></div>`;
  }).join('');

  const allMeaningsHint = checked ? `<div class="field-hint" style="margin-top:6px;">Alle hinterlegten Bedeutungen: ${escapeHtml(v.meanings.join(', '))}</div>` : '';

  return `
    <div class="panel">
      <div class="test-progress">FRAGE ${state.test.idx+1} / ${state.test.queue.length}</div>
      <div class="test-word">${escapeHtml(v.latin)}</div>
      <div class="test-type">${TYPE_LABELS[v.type]}</div>
      ${q.fields.length ? `<div class="answer-block"><div class="block-title">Formen</div>${fieldsHtml}</div>` : ''}
      <div class="answer-block">
        <div class="block-title">Bedeutung${q.meaningCount>1?'en':''} (${q.meaningCount})</div>
        ${meaningsHtml}${allMeaningsHint}
      </div>
      <div class="btn-row">
        ${!checked ? `<button class="btn" id="checkAnswerBtn">Prüfen</button>` : `<button class="btn" id="nextQuestionBtn">${state.test.idx+1 < state.test.queue.length ? 'Weiter ▶' : 'Ergebnis anzeigen'}</button>`}
      </div>
    </div>
  `;
}

function gradeMeaningsForDisplay(meanings, count, answers){
  const correctNorm = meanings.map(normalize);
  const used = new Array(correctNorm.length).fill(false);
  const results = [];
  for(let i=0;i<count;i++){
    const val = normalize(answers['meaning:'+i] || '');
    let found = false;
    if(val){
      for(let j=0;j<correctNorm.length;j++){ if(!used[j] && correctNorm[j]===val){ used[j]=true; found=true; break; } }
    }
    results.push(found);
  }
  // for each wrong/blank slot, offer one of the still-unused correct meanings as the suggested answer
  const leftover = [];
  for(let j=0;j<meanings.length;j++) if(!used[j]) leftover.push(meanings[j]);
  let li = 0;
  const suggestions = results.map(ok => {
    if(ok) return null;
    const s = li < leftover.length ? leftover[li] : (meanings[0] || '');
    li++;
    return s;
  });
  return { results, suggestions };
}

function renderTestSummary(){
  let totalFields=0, correctFields=0, totalMeanings=0, correctMeanings=0;
  const details = state.test.results.map(r=>`
    <div class="summary-item"><span class="sw">${escapeHtml(r.latin)}</span>
      <div class="detail">Formen: ${r.formsCorrect}/${r.formsTotal} · Bedeutungen: ${r.meaningsCorrect}/${r.meaningsTotal}</div></div>
  `).join('');
  state.test.results.forEach(r=>{
    totalFields += r.formsTotal; correctFields += r.formsCorrect;
    totalMeanings += r.meaningsTotal; correctMeanings += r.meaningsCorrect;
  });
  const total = totalFields + totalMeanings;
  const correct = correctFields + correctMeanings;
  const pct = total>0 ? Math.round((correct/total)*100) : 0;

  return `
    <div class="panel">
      <h2 class="section-title">Testergebnis</h2>
      <div class="summary-score"><div class="big">${pct}%</div><div class="lbl">${correct} von ${total} richtig</div></div>
      <div class="summary-list">${details}</div>
      <div class="btn-row"><button class="btn" id="restartTestBtn">Neuer Test</button></div>
    </div>
  `;
}
