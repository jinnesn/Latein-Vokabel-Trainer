      ${selectedIds.length ? `<button type="button" class="folder-menu-item" data-select-scope="none"><span class="fm-box plain"></span><span class="fm-name">Keine auswählen</span></button>` : ''}
    </div>`;
  })() : '';
  const bulkBar = state.poolSelectMode ? `
    <div class="bulk-bar">
      <div class="bulk-folder">
        <button type="button" class="bulk-btn ${state.folderMenuOpen==='select'?'open':''}" id="bulkSelectBtn" title="Mehrere auf einmal auswählen">${ICON.checks}<span class="bulk-btn-label">Auswählen</span>${ICON.chevron}</button>
        ${selectMenu}
      </div>

function bindPoolTabEvents(){
  const toggleSelectMode = document.getElementById('toggleSelectMode');
  if(toggleSelectMode) toggleSelectMode.addEventListener('click', ()=>{
    state.poolSelectMode = !state.poolSelectMode;
    if(!state.poolSelectMode) state.poolSelected = {};
    render();
  });
  const poolSearch = document.getElementById('poolSearch');
  if(poolSearch) poolSearch.addEventListener('input', e=>{
    const pos = e.target.selectionStart;
    state.poolFilter = e.target.value;
    state.poolPage = 1;
    render();
    const el2 = document.getElementById('poolSearch');
    if(el2){ el2.focus(); el2.setSelectionRange(pos, pos); }
  });
  document.querySelectorAll('[data-folder-chip]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.poolFolderFilter = btn.dataset.folderChip;
      state.poolPage = 1;
      render();
    });
  });
  const poolSort = document.getElementById('poolSort');
  if(poolSort) poolSort.addEventListener('change', e=>{ state.poolSort = e.target.value; render(); });
  const poolPrevPage = document.getElementById('poolPrevPage');
  if(poolPrevPage) poolPrevPage.addEventListener('click', ()=>{ state.poolPage -= 1; render(); });
  const poolNextPage = document.getElementById('poolNextPage');
  if(poolNextPage) poolNextPage.addEventListener('click', ()=>{ state.poolPage += 1; render(); });
  if(state.poolSelectMode) bindPoolDragSelect();
  const bulkSelectBtn = document.getElementById('bulkSelectBtn');
  if(bulkSelectBtn) bulkSelectBtn.addEventListener('click', ()=>{ state.folderMenuOpen = state.folderMenuOpen === 'select' ? false : 'select'; render(); });
  document.querySelectorAll('[data-select-scope]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.selectScope;
      applySelectScope(key);
      if(key === 'none') state.folderMenuOpen = false;
      render();
    });
  });
  const bulkFolderBtn = document.getElementById('bulkFolderBtn');
  if(bulkFolderBtn) bulkFolderBtn.addEventListener('click', ()=>{ state.folderMenuOpen = state.folderMenuOpen === 'add' ? false : 'add'; render(); });
  const bulkUnfolderBtn = document.getElementById('bulkUnfolderBtn');
  if(bulkUnfolderBtn) bulkUnfolderBtn.addEventListener('click', ()=>{ state.folderMenuOpen = state.folderMenuOpen === 'remove' ? false : 'remove'; render(); });
  const selectedNow = () => Object.keys(state.poolSelected).filter(id=>state.poolSelected[id]);
  const hasFolder = (id, fid) => { const v = state.pool.find(x=>x.id===id); return !!v && (v.folderIds||[]).includes(fid); };
  const undoAction = work => ({ label:'Rückgängig', fn: async ()=>{
    try{ await work(); await loadPool(); render(); showToast('Rückgängig gemacht', { type:'info' }); }
    catch(err){ console.error(err); showToast('Rückgängig hat nicht geklappt: ' + err.message, { type:'error' }); }
  }});
  document.querySelectorAll('[data-bulk-folder]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(bulkFolderBusy) return;
      const fid = btn.dataset.bulkFolder;
      const ids = selectedNow();
      if(ids.length === 0) return;
      const name = folderName(fid) || 'Ordner';
      const missing = ids.filter(id=>!hasFolder(id, fid));
      state.folderMenuOpen = false;
      if(missing.length === 0){
        render();
        showToast((ids.length === 1 ? 'Die Vokabel ist' : 'Alle ' + ids.length + ' sind') + ' schon in „' + name + '“', { type:'info' });
        return;
      }
      bulkFolderBusy = true;
      try{
        await bulkAddToFolder(missing, fid);
        await loadPool();
        state.poolSelected = {};
        AudioEngine.playSave();
        render();
        showToast(plural(missing.length, 'Vokabel', 'Vokabeln') + ' zu „' + name + '“ hinzugefügt',
          { type:'success', action: undoAction(()=> bulkRemoveFromFolder(missing, fid)) });
      }catch(err){
        console.error(err); render();
        showToast('Das hat nicht geklappt: ' + err.message, { type:'error' });
      }finally{ bulkFolderBusy = false; }
    });
  });
  document.querySelectorAll('[data-bulk-unfolder]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(bulkFolderBusy) return;
      const fid = btn.dataset.bulkUnfolder;
      const ids = selectedNow().filter(id=>hasFolder(id, fid));
      if(ids.length === 0) return;
      const name = folderName(fid) || 'Ordner';
      state.folderMenuOpen = false;
      bulkFolderBusy = true;
      try{
        await bulkRemoveFromFolder(ids, fid);
        await loadPool();
        state.poolSelected = {};
        AudioEngine.playTick();
        render();
        showToast(plural(ids.length, 'Vokabel', 'Vokabeln') + ' aus „' + name + '“ entfernt',
          { type:'success', action: undoAction(()=> bulkAddToFolder(ids, fid)) });
      }catch(err){
        console.error(err); render();
        showToast('Das hat nicht geklappt: ' + err.message, { type:'error' });
      }finally{ bulkFolderBusy = false; }
    });
  });
  const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
  if(bulkDeleteBtn) bulkDeleteBtn.addEventListener('click', async ()=>{
    const ids = Object.keys(state.poolSelected).filter(id=>state.poolSelected[id]);
    if(ids.length===0) return;
    const ok = await confirmDialog({
      title: 'Vokabeln löschen?',
      message: ids.length + (ids.length===1 ? ' Vokabel' : ' Vokabeln') + ' werden endgültig gelöscht.',
      confirmLabel: 'Löschen',
      danger: true
    });
    if(!ok) return;
    try{
      await bulkDeleteVocab(ids);
      if(ids.includes(state.editingId)) resetDraft();
      state.poolSelected = {};
      await loadPool();
      render();
      showToast(plural(ids.length, 'Vokabel', 'Vokabeln') + ' gelöscht', { type:'success' });
    }catch(err){ console.error(err); showToast('Löschen fehlgeschlagen: ' + err.message, { type:'error' }); }
  });
  const bulkClearBtn = document.getElementById('bulkClearBtn');
  if(bulkClearBtn) bulkClearBtn.addEventListener('click', ()=>{ state.poolSelected = {}; state.folderMenuOpen = false; render(); });
  const createFolderBtn = document.getElementById('createFolderBtn');
  if(createFolderBtn) createFolderBtn.addEventListener('click', async ()=>{
    const nameInput = document.getElementById('newFolderName');
    const name = nameInput.value.trim();
    if(!name) return;
    try{ await insertFolder(name); await loadPool(); render(); }
    catch(err){ console.error(err); showToast('Ordner konnte nicht erstellt werden: ' + err.message, { type:'error' }); }
  });
  document.querySelectorAll('[data-delete-folder]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const fid = btn.dataset.deleteFolder;
      try{
        await deleteFolderRow(fid);
        state.draftFolderIds = state.draftFolderIds.filter(id=>id!==fid);
        if(state.poolFolderFilter===fid) state.poolFolderFilter = '';
        await loadPool();
        render();
      }catch(err){ console.error(err); }
    });
  });
  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      startEditEntry(state.pool.find(x=>x.id===btn.dataset.edit));
      setActiveTab('add');
    });
  });
  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        await deleteVocabRow(btn.dataset.delete);
        if(state.editingId===btn.dataset.delete) resetDraft();
        delete state.poolSelected[btn.dataset.delete];
        await loadPool();
        render();
      }catch(err){ console.error(err); }
    });
  });
}
function bindPoolDragSelect(){
  const list = document.querySelector('.pool-list');
  if(!list) return;
  const rows = () => Array.from(list.querySelectorAll('[data-row]'));
  let drag = null, raf = null, pt = { x:0, y:0 };
  function paint(){
    rows().forEach(r=>{
      const on = !!state.poolSelected[r.dataset.row];
      r.classList.toggle('selected', on);
      const cb = r.querySelector('.pool-checkbox'); if(cb) cb.checked = on;
    });
  }
  function applyRange(cur){
    const lo = Math.min(drag.start, cur), hi = Math.max(drag.start, cur);
    drag.ids.forEach((id, i)=>{
      const on = (i >= lo && i <= hi) ? drag.target : !!drag.baseline[id];
      if(on) state.poolSelected[id] = true; else delete state.poolSelected[id];
    });
    paint();
  }
  function begin(row){
    const ids = rows().map(r=>r.dataset.row);
    const start = ids.indexOf(row.dataset.row);
    drag = { ids, start, target: !state.poolSelected[ids[start]], baseline: Object.assign({}, state.poolSelected) };
    applyRange(start);
  }
  function moveTo(x, y){
    if(!drag) return;
    const el = document.elementFromPoint(x, y);
    const row = el && el.closest ? el.closest('[data-row]') : null;
    if(row && list.contains(row)){ applyRange(drag.ids.indexOf(row.dataset.row)); return; }
    const els = rows(); if(!els.length) return;
    if(y < els[0].getBoundingClientRect().top) applyRange(0);
    else if(y > els[els.length-1].getBoundingClientRect().bottom) applyRange(els.length-1);
  }
  function autoScroll(){
    if(!drag){ raf = null; return; }
    const m = 70; let dy = 0;
    if(pt.y < m) dy = -Math.ceil((m - pt.y) / 6);
    else if(pt.y > window.innerHeight - m) dy = Math.ceil((pt.y - (window.innerHeight - m)) / 6);
    if(dy){ window.scrollBy(0, dy); moveTo(pt.x, pt.y); }
    raf = requestAnimationFrame(autoScroll);
  }
  function finish(){
    if(!drag) return;
    drag = null;
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    render();
  }
  list.addEventListener('pointerdown', e=>{
    if(e.pointerType !== 'mouse' || e.button !== 0) return;
    if(e.target.closest('.actions')) return;
    const row = e.target.closest('[data-row]'); if(!row) return;
    e.preventDefault();
    begin(row);
    pt = { x:e.clientX, y:e.clientY };
    raf = requestAnimationFrame(autoScroll);
    const onMove = ev=>{ pt = { x:ev.clientX, y:ev.clientY }; moveTo(pt.x, pt.y); };
    const onUp = ()=>{
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      finish();
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
  let touch = null;
  list.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1 || e.target.closest('.actions')) return;
    const row = e.target.closest('[data-row]'); if(!row) return;
    const t = e.touches[0];
    touch = { row, x:t.clientX, y:t.clientY, active:false, moved:false };
    const me = touch;
    me.timer = setTimeout(()=>{
      if(touch !== me || me.moved) return;
      me.active = true; begin(me.row); pt = { x:me.x, y:me.y };
      raf = requestAnimationFrame(autoScroll);
      if(navigator.vibrate) navigator.vibrate(8);
    }, 280);
  }, { passive:true });
  list.addEventListener('touchmove', e=>{
    if(!touch) return;
    const t = e.touches[0];
    if(!touch.active){
      if(Math.hypot(t.clientX - touch.x, t.clientY - touch.y) > 10){ touch.moved = true; clearTimeout(touch.timer); }
      return;
    }
    e.preventDefault();
    pt = { x:t.clientX, y:t.clientY }; moveTo(pt.x, pt.y);
  }, { passive:false });
  list.addEventListener('touchend', e=>{
    if(!touch) return;
    const me = touch; touch = null; clearTimeout(me.timer);
    if(me.active){ e.preventDefault(); finish(); }
    else if(!me.moved){ e.preventDefault(); begin(me.row); finish(); }
  }, { passive:false });
  list.addEventListener('touchcancel', ()=>{
    if(!touch) return;
    const me = touch; touch = null; clearTimeout(me.timer);
    if(me.active) finish();
  });
}

/* ===================== PRACTICE ===================== */
function renderPracticeTab(){
  if(state.pool.length===0){
    return `<div class="panel"><div class="empty-state"><div class="empty-title">Leerer Pool</div><div class="empty-note">Füge zuerst ein paar Vokabeln hinzu.</div></div></div>`;
  }
  const filtered = poolByFolder(state.practice.folderId);
  const folderSelectHtml = `
    <select class="folder-select" id="practiceFolderSelect" aria-label="Ordner wählen">
      <option value="" ${!state.practice.folderId?'selected':''}>Alle Ordner</option>
      ${state.folders.map(f=>`<option value="${f.id}" ${state.practice.folderId===f.id?'selected':''}>${escapeHtml(f.name)}</option>`).join('')}
    </select>`;
  if(filtered.length===0){
    return `<div class="panel practice-wrap"><div class="practice-top-row"><span></span>${folderSelectHtml}</div>
      <div class="empty-state"><div class="empty-title">Keine Vokabeln</div><div class="empty-note">In diesem Ordner sind keine Vokabeln.</div></div></div>`;
  }
  if(state.practice.order.length===0 || !state.practice.order.every(id => filtered.some(v=>v.id===id))){
    state.practice.order = shuffle(filtered.map(v=>v.id));
    state.practice.idx = 0; state.practice.flipped = false;
  }
  if(state.practice.idx >= state.practice.order.length) state.practice.idx = 0;
  const id = state.practice.order[state.practice.idx];
  const v = state.pool.find(x=>x.id===id);
  if(!v){
    state.practice.order = shuffle(filtered.map(x=>x.id));
    state.practice.idx = 0;
    return renderPracticeTab();
  }
  const formsLines = formFieldsFor(v.type).map(f=>{
    const val = v.forms[f.key];
    if(!val) return null;
    return `${f.label.replace('(falls vorhanden)','').trim()}: <b>${escapeHtml(val)}</b>`;
  }).filter(Boolean).join('<br>');
  const progressPct = Math.round(((state.practice.idx+1) / state.practice.order.length) * 100);
  return `
    <div class="panel practice-wrap">
      <div class="practice-top-row">
        <div class="practice-progress">KARTE ${state.practice.idx+1} / ${state.practice.order.length}</div>
        ${folderSelectHtml}
      </div>
      <div class="practice-progress-bar" aria-hidden="true">
        <div class="practice-progress-fill" style="width:${progressPct}%"></div>
      </div>
      <div class="flashcard ${state.practice.flipped?'flipped':''}" id="flashcard">
        <div class="flashcard-inner">
          <div class="face front">
            <div class="word">${escapeHtml(v.latin)}</div>
            <div class="type-tag">${TYPE_LABELS[v.type]}</div>
            <div class="flip-hint">antippen zum Umdrehen</div>
          </div>
          <div class="face back">
            <div class="word">${escapeHtml(v.latin)}</div>
            ${formsLines ? `<div class="forms">${formsLines}</div>` : ''}
            <hr>
            <div class="meanings">${escapeHtml(v.meanings.join(', '))}</div>
            ${v.notes ? `<div class="card-notes">${escapeHtml(v.notes)}</div>` : ''}
          </div>
        </div>
      </div>
      <div class="practice-controls">
        <button class="btn secondary small" id="prevCard">◀ Zurück</button>
        <button class="btn secondary small" id="editFromPractice">✎ Bearbeiten</button>
        <button class="btn secondary small" id="shuffleCards">Neu mischen</button>
        <button class="btn small" id="nextCard">Weiter ▶</button>
      </div>
      <div class="keyboard-hint">
        <kbd>←</kbd> zurück &nbsp;·&nbsp; <kbd>Space</kbd> umdrehen &nbsp;·&nbsp; <kbd>→</kbd> weiter
      </div>
    </div>
  `;
}
function bindPracticeEvents(){
  const folderSelect = document.getElementById('practiceFolderSelect');
  if(folderSelect) folderSelect.addEventListener('change', e=>{ state.practice.folderId = e.target.value; state.practice.order = []; render(); });
  const card = document.getElementById('flashcard');
  if(!card) return;
  card.addEventListener('click', ()=>{ state.practice.flipped = !state.practice.flipped; card.classList.toggle('flipped', state.practice.flipped); AudioEngine.playFlip(); });
  document.getElementById('nextCard').addEventListener('click', ()=>{
    state.practice.idx = (state.practice.idx+1) % state.practice.order.length;
    state.practice.flipped = false; render();
  });
  document.getElementById('prevCard').addEventListener('click', ()=>{
    state.practice.idx = (state.practice.idx-1+state.practice.order.length) % state.practice.order.length;
    state.practice.flipped = false; render();
  });
  document.getElementById('shuffleCards').addEventListener('click', ()=>{
    const filtered = poolByFolder(state.practice.folderId);
    state.practice.order = shuffle(filtered.map(v=>v.id));
    state.practice.idx = 0; state.practice.flipped = false; render();
  });
  document.getElementById('editFromPractice').addEventListener('click', ()=>{
    const id = state.practice.order[state.practice.idx];
    startEditEntry(state.pool.find(x=>x.id===id));
    setActiveTab('add');
  });
}

            <div class="count-main">
              <div class="count-stepper">
                <button type="button" class="count-step" id="countMinus" aria-label="Weniger">−</button>
                <input type="text" inputmode="numeric" pattern="[0-9]*" class="count-value" id="countInput" value="${currentCount}" aria-label="Anzahl Vokabeln eingeben">
                <button type="button" class="count-step" id="countPlus" aria-label="Mehr">+</button>
              </div>
            </div>
            <div class="count-label">von <strong>${max}</strong> Vokabeln im gewählten Bereich</div>
            <div class="count-slider-row">
              <input type="range" id="countSlider" min="1" max="${max}" value="${currentCount}" aria-label="Anzahl über Regler wählen">
            </div>
            <div class="count-presets">
              ${[5,10,20,50].filter(n => n < max).map(n =>
                `<button type="button" class="count-preset ${currentCount===n?'active':''}" data-count="${n}">${n}</button>`
              ).join('')}
              <button type="button" class="count-preset ${allSelected?'active':''}" data-count="all">Alle (${max})</button>
            </div>
          </div>
        </div>
        <div class="test-step">
          <div class="test-step-label"><span class="test-step-num">3</span>Was soll abgefragt werden?</div>
          <div class="settings-group">
            <div class="toggle-row">
              <div><div class="label">Formen abfragen</div><div class="desc">Stammformen, Genitiv/Genus bzw. Adjektivformen</div></div>
              <label class="switch"><input type="checkbox" id="withFormsToggle" ${state.test.settings.withForms?'checked':''} aria-label="Formen abfragen"><span class="track"><span class="knob"></span></span></label>
            </div>
            <div class="meanings-row">
              <div class="label">Bedeutungen</div>
              <div class="segmented" id="meaningsModeSegmented">
                <button type="button" data-meaningsmode="one" class="${state.test.settings.meaningsMode==='one'?'active':''}">Eine</button>
                <button type="button" data-meaningsmode="random" class="${state.test.settings.meaningsMode==='random'?'active':''}">1–3 zufällig</button>
                <button type="button" data-meaningsmode="all" class="${state.test.settings.meaningsMode==='all'?'active':''}">Alle</button>
              </div>
            </div>
          </div>
        </div>`}
      </div>
      <div class="btn-row" style="margin-top:24px;"><button class="btn" id="startTestBtn" ${max===0?'disabled':''}>Test starten</button></div>
    </div>
  `;
}
function meaningCountFor(v, mode){
  const total = v.meanings.length;
  if(total === 0) return 0;
  if(mode === 'one') return 1;
  if(mode === 'all') return total;
  const cap = Math.min(3, total);
  return 1 + Math.floor(Math.random() * cap);
}
function buildQuestionFor(v){
  const fields = state.test.settings.withForms ? formFieldsFor(v.type).filter(f => v.forms[f.key]) : [];
  const meaningCount = meaningCountFor(v, state.test.settings.meaningsMode);
  return { id: v.id, fields, meaningCount };
}
function renderTestQuestion(){
  const q = state.test.queue[state.test.idx];
  const v = state.pool.find(x=>x.id===q.id);
  const checked = state.test.checked;
  const answers = state.test.answers;
  const fieldsHtml = q.fields.map(f=>{
    const key = 'field:'+f.key;
    const val = answers[key] || '';
    if(!checked){
      return `<div class="answer-input-row"><label class="field-label">${f.label}</label>
        <input type="text" data-answer="${key}" value="${escapeHtml(val)}"></div>`;
    }
    const correct = f.key==='genus' ? normalizeGenus(val)===normalizeGenus(v.forms[f.key]) : normalize(val)===normalize(v.forms[f.key]);
    const inner = correct
      ? `<span>${escapeHtml(val)}</span><span class="check-icon">✓</span>`
      : `${val.trim() ? `<span class="wrong-strike">${escapeHtml(val)}</span>` : ''}<span class="correct-fill">${escapeHtml(v.forms[f.key])}</span>`;
    return `<div class="answer-input-row"><label class="field-label">${f.label}</label>
      <div class="answer-display ${correct?'correct':'incorrect'}">${inner}</div></div>`;
  }).join('');
  const correctMeaningsNorm = checked ? gradeMeaningsForDisplay(v.meanings, q.meaningCount, answers) : null;
  const meaningsHtml = Array.from({length:q.meaningCount}).map((_,i)=>{
    const key = 'meaning:'+i;
    const val = answers[key] || '';
    if(!checked){
      return `<div class="answer-input-row"><input type="text" data-answer="${key}" value="${escapeHtml(val)}" placeholder="Bedeutung ${i+1}" aria-label="Bedeutung ${i+1}"></div>`;
    }
    const isCorrect = correctMeaningsNorm.results[i];
    const suggestion = correctMeaningsNorm.suggestions[i];
    const inner = isCorrect
      ? `<span>${escapeHtml(val)}</span><span class="check-icon">✓</span>`
      : `${val.trim() ? `<span class="wrong-strike">${escapeHtml(val)}</span>` : ''}<span class="correct-fill">${escapeHtml(suggestion||'')}</span>`;
    return `<div class="answer-input-row"><div class="answer-display ${isCorrect?'correct':'incorrect'}">${inner}</div></div>`;
  }).join('');
  const allMeaningsHint = checked ? `<div class="field-hint" style="margin-top:6px;">Alle hinterlegten Bedeutungen: ${escapeHtml(v.meanings.join(', '))}</div>` : '';
  const progressPct = Math.round(((state.test.idx) / state.test.queue.length) * 100);
  return `
    <div class="panel">
      <div class="test-progress">FRAGE ${state.test.idx+1} / ${state.test.queue.length}</div>
      <div class="test-progress-bar" aria-hidden="true"><div class="test-progress-fill" style="width:${progressPct}%"></div></div>
      <div class="test-word">${escapeHtml(v.latin)}</div>
      <div class="test-type">${TYPE_LABELS[v.type]}</div>
      ${q.fields.length ? `<div class="answer-block"><div class="block-title">Formen</div>${fieldsHtml}</div>` : ''}
      <div class="answer-block">
        <div class="block-title">Bedeutung${q.meaningCount>1?'en':''} (${q.meaningCount})</div>
        ${meaningsHtml}${allMeaningsHint}
      </div>
      <div class="btn-row">
        ${!checked ? `<button class="btn" id="checkAnswerBtn">Prüfen</button>` : `<button class="btn" id="nextQuestionBtn">${state.test.idx+1 < state.test.queue.length ? 'Weiter ▶' : 'Ergebnis anzeigen'}</button>`}
      </div>
    </div>
  `;
}
function gradeMeaningsForDisplay(meanings, count, answers){
  const correctNorm = meanings.map(normalize);
  const used = new Array(correctNorm.length).fill(false);
  const results = [];
  for(let i=0;i<count;i++){
    const val = normalize(answers['meaning:'+i] || '');
    let found = false;
    if(val){
      for(let j=0;j<correctNorm.length;j++){ if(!used[j] && correctNorm[j]===val){ used[j]=true; found=true; break; } }
    }
    results.push(found);
  }
  const leftover = [];
  for(let j=0;j<meanings.length;j++) if(!used[j]) leftover.push(meanings[j]);
  let li = 0;
  const suggestions = results.map(ok => {
    if(ok) return null;
    const s = li < leftover.length ? leftover[li] : (meanings[0] || '');
    li++;
    return s;
  });
  return { results, suggestions };
}
function renderTestSummary(){
  let totalFields=0, correctFields=0, totalMeanings=0, correctMeanings=0;
  const details = state.test.results.map(r=>`
    <div class="summary-item"><span class="sw">${escapeHtml(r.latin)}</span>
      <span class="detail">Formen ${r.formsCorrect}/${r.formsTotal} · Bed. ${r.meaningsCorrect}/${r.meaningsTotal}</span></div>
  `).join('');
  state.test.results.forEach(r=>{
    totalFields += r.formsTotal; correctFields += r.formsCorrect;
    totalMeanings += r.meaningsTotal; correctMeanings += r.meaningsCorrect;
  });
  const total = totalFields + totalMeanings;
  const correct = correctFields + correctMeanings;
  const pct = total>0 ? Math.round((correct/total)*100) : 0;
  return `
    <div class="panel">
      <h2 class="section-title">Testergebnis</h2>
      <div class="summary-score">
        <div class="big">${pct}%</div>
        <div class="lbl">${correct} von ${total} richtig</div>
      </div>
      <div class="summary-list">${details}</div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" id="restartTestBtn">Neuer Test</button>
      </div>
    </div>
  `;
}
function bindTestEvents(){
  const folderSelect = document.getElementById('testFolderSelect');
  if(folderSelect){
    folderSelect.addEventListener('change', e=>{
      state.test.settings.folderId = e.target.value;
      const filtered = poolByFolder(state.test.settings.folderId);
      state.test.settings.count = Math.min(state.test.settings.count || 10, filtered.length || 1);
      render();
    });
  }
  const max = poolByFolder(state.test.settings.folderId).length;
  const slider = document.getElementById('countSlider');
  const input = document.getElementById('countInput');
  const minusBtn = document.getElementById('countMinus');
  const plusBtn = document.getElementById('countPlus');

  function refreshUI(v){
    if(slider) slider.value = v;
    if(input && document.activeElement !== input) input.value = v;
    if(input && document.activeElement === input){
      // Nur wenn Nutzer gerade tippt: nicht überschreiben
    }
    document.querySelectorAll('.count-preset').forEach(b=>{
      const dc = b.dataset.count;
      if(dc === 'all') b.classList.toggle('active', v === max);
      else b.classList.toggle('active', parseInt(dc,10) === v);
    });
    if(minusBtn) minusBtn.disabled = v <= 1;
    if(plusBtn) plusBtn.disabled = v >= max;
  }

  function setCount(v){
    if(isNaN(v)) return;
    v = Math.max(1, Math.min(v, max));
    state.test.settings.count = v;
    refreshUI(v);
  }

  if(slider) slider.addEventListener('input', e=> setCount(parseInt(e.target.value,10)));
  if(minusBtn) minusBtn.addEventListener('click', ()=> setCount(state.test.settings.count - 1));
  if(plusBtn) plusBtn.addEventListener('click', ()=> setCount(state.test.settings.count + 1));

  if(input){
    input.addEventListener('input', e=>{
      // Nur Ziffern erlauben
      let raw = e.target.value.replace(/[^0-9]/g, '');
      if(raw !== e.target.value) e.target.value = raw;
      if(raw === '') return;
      let v = parseInt(raw, 10);
      if(!isNaN(v)){
        v = Math.max(1, Math.min(v, max));
        state.test.settings.count = v;
        if(slider) slider.value = v;
        document.querySelectorAll('.count-preset').forEach(b=>{
          const dc = b.dataset.count;
          if(dc === 'all') b.classList.toggle('active', v === max);
          else b.classList.toggle('active', parseInt(dc,10) === v);
        });
        if(minusBtn) minusBtn.disabled = v <= 1;
        if(plusBtn) plusBtn.disabled = v >= max;
      }
    });
    input.addEventListener('blur', e=>{
      setCount(parseInt(e.target.value, 10) || 1);
    });
    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); setCount(parseInt(input.value,10) || 1); input.blur(); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); setCount(state.test.settings.count + 1); }
      else if(e.key === 'ArrowDown'){ e.preventDefault(); setCount(state.test.settings.count - 1); }
    });
  }

  document.querySelectorAll('.count-preset').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const dc = btn.dataset.count;
      if(dc === 'all') setCount(max);
      else setCount(parseInt(dc,10));
    });
  });

  refreshUI(state.test.settings.count);

  const toggle = document.getElementById('withFormsToggle');
  if(toggle) toggle.addEventListener('change', e=>{ state.test.settings.withForms = e.target.checked; });
  document.querySelectorAll('#meaningsModeSegmented button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.test.settings.meaningsMode = btn.dataset.meaningsmode;
      render();
    });
  });
  const startBtn = document.getElementById('startTestBtn');
  if(startBtn) startBtn.addEventListener('click', ()=>{
    const filtered = poolByFolder(state.test.settings.folderId);
    const count = Math.max(1, Math.min(state.test.settings.count, filtered.length));
    const ids = shuffle(filtered.map(v=>v.id)).slice(0, count);
    state.test.queue = ids.map(id => buildQuestionFor(state.pool.find(v=>v.id===id)));
    state.test.idx = 0; state.test.results = []; state.test.answers = {}; state.test.checked = false;
    state.test.phase = 'running';
    render();
  });
  document.querySelectorAll('[data-answer]').forEach(inp=>{
    inp.addEventListener('input', e=>{ state.test.answers[e.target.dataset.answer] = e.target.value; });
  });
  const checkBtn = document.getElementById('checkAnswerBtn');
  if(checkBtn) checkBtn.addEventListener('click', ()=>{
    const q = state.test.queue[state.test.idx];
    const v = state.pool.find(x=>x.id===q.id);
    let formsCorrect = 0;
    q.fields.forEach(f=>{
      const val = state.test.answers['field:'+f.key] || '';
      const ok = f.key==='genus' ? normalizeGenus(val)===normalizeGenus(v.forms[f.key]) : normalize(val)===normalize(v.forms[f.key]);
      if(ok) formsCorrect++;
    });
    const mResult = gradeMeaningsForDisplay(v.meanings, q.meaningCount, state.test.answers);
    const meaningsCorrect = mResult.results.filter(Boolean).length;
    state.test.results.push({ latin: v.latin, formsCorrect, formsTotal: q.fields.length, meaningsCorrect, meaningsTotal: q.meaningCount });
    state.test.checked = true;
    const allCorrect = formsCorrect === q.fields.length && meaningsCorrect === q.meaningCount;
    if(allCorrect) AudioEngine.playCorrect(); else AudioEngine.playIncorrect();
    render();
  });
  const nextBtn = document.getElementById('nextQuestionBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    state.test.idx++; state.test.answers = {}; state.test.checked = false;
    if(state.test.idx >= state.test.queue.length) state.test.phase = 'summary';
    render();
  });
  const restartBtn = document.getElementById('restartTestBtn');
  if(restartBtn) restartBtn.addEventListener('click', ()=>{ state.test.phase = 'settings'; render(); });
}

function bindTabEvents(){
  if(state.activeTab==='add') bindAddTabEvents();
  else if(state.activeTab==='pool') bindPoolTabEvents();
  else if(state.activeTab==='practice') bindPracticeEvents();
  else if(state.activeTab==='test') bindTestEvents();
}

document.addEventListener('click', e=>{
  const path = typeof e.composedPath === 'function' ? e.composedPath() : [];
  if(state.profileMenuOpen){
    const inside = path.some(node => node.classList && (node.classList.contains('avatar-btn') || node.classList.contains('dropdown')));
    const isAvatarBtn = e.target.id === 'profileMenuBtn';
    if(!inside && !isAvatarBtn){
      state.profileMenuOpen = false;
      state.changePasswordOpen = false;
      render();
    }
  }
  if(state.folderMenuOpen){
    const insideFolder = path.some(node => node.classList && (node.classList.contains('bulk-folder') || node.classList.contains('folder-menu')));
    if(!insideFolder){
      state.folderMenuOpen = false;
      render();
    }
  }
  if(state.settingsMenuOpen){
    const insideSettings = path.some(node => node.classList && (node.classList.contains('round-btn') || node.classList.contains('dropdown')));
    const isSettingsBtn = e.target.id === 'settingsMenuBtn' || (e.target.closest && e.target.closest('#settingsMenuBtn'));
    if(!insideSettings && !isSettingsBtn){
      state.settingsMenuOpen = false;
      render();
    }
  }
});

document.addEventListener('keydown', e=>{
  if(state.user && !state.profileMenuOpen && !state.settingsMenuOpen){
    const tag = document.activeElement ? document.activeElement.tagName : '';
    if(tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT'){
      if(e.key === '1'){ setActiveTab('add'); return; }
      if(e.key === '2'){ setActiveTab('pool'); return; }
      if(e.key === '3' && state.pool.length){ setActiveTab('practice'); return; }
      if(e.key === '4' && state.pool.length){ setActiveTab('test'); return; }
    }
  }
  if(state.activeTab === 'practice' && state.user){
    const card = document.getElementById('flashcard');
    if(!card) return;
    const tag = document.activeElement ? document.activeElement.tagName : '';
    if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar' || e.key === 'ArrowRight'){
      e.preventDefault();
      if(!state.practice.flipped){ card.click(); }
      else { const btn = document.getElementById('nextCard'); if(btn) btn.click(); }
    } else if(e.key === 'ArrowLeft'){
      e.preventDefault();
      if(state.practice.flipped){ card.click(); }
      else { const btn = document.getElementById('prevCard'); if(btn) btn.click(); }
    }
  } else if(state.activeTab === 'test' && state.test.phase === 'running'){
    if(e.key !== 'Enter') return;
    const tag = document.activeElement ? document.activeElement.tagName : '';
    if(tag === 'SELECT') return;
    e.preventDefault();
    const checkBtn = document.getElementById('checkAnswerBtn');
    const nextBtn = document.getElementById('nextQuestionBtn');
    if(nextBtn){ nextBtn.click(); return; }
    const inputs = Array.from(document.querySelectorAll('[data-answer]'));
    const idx = inputs.indexOf(document.activeElement);
    if(idx > -1 && idx < inputs.length - 1){
      inputs[idx+1].focus();
      if(inputs[idx+1].select) inputs[idx+1].select();
    } else if(checkBtn){
      checkBtn.click();
    }
  }
});

(async function init(){
  loadDictionary();
  if(STARTUP_ERROR || !sbClient){ render(); return; }
  state.loading = true;
  render();
  try{
    const { data: { session } } = await sbClient.auth.getSession();
    state.user = session ? session.user : null;
    if(state.user) await loadPool();
    state.loading = false;
    render();
    sbClient.auth.onAuthStateChange(async (event, session) => {
      if(event === 'PASSWORD_RECOVERY'){
        state.authView = 'recovery';
        state.user = session ? session.user : state.user;
        render();
        return;
      }
      const newUser = session ? session.user : null;
      const wasLoggedIn = !!state.user;
      state.user = newUser;
      if(newUser && !wasLoggedIn){
        state.loading = true;
        render();
        await loadPool();
        state.loading = false;
        state.activeTab = 'add';
        render();
      } else if(!newUser && wasLoggedIn){
        state.pool = []; state.folders = [];
        render();
      }
    });
  }catch(e){
    console.error('Startfehler:', e);
    STARTUP_ERROR = 'sdk';
    state.loading = false;
    render();
  }
})();
</script>

setTimeout(function(){
  var content = document.getElementById('content');
  var stillBlank = content && content.innerHTML.trim() === '';
  if(stillBlank){
    content.innerHTML =
      '<div class="panel"><h2 class="section-title">Es ist ein unerwarteter Fehler aufgetreten</h2>' +
      '<div class="setup-notice">Die Seite konnte nicht vollständig starten. Lade die Seite neu oder öffne die Browser-Konsole (F12).</div></div>';
  }
}, 4000);
</script>
